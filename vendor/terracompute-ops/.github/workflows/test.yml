name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install static checker
        run: python -m pip install pyflakes==3.4.0
      - name: Unit and offline integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Offline target-probe fixtures
        run: python tests/target_probe_test.py -v
      - name: Static checks
        run: python -m pyflakes src tests target/terracompute-probe.py
