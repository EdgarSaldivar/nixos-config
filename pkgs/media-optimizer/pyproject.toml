[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "media-optimizer"
version = "0.1.0"
requires-python = ">=3.11"
description = "Journaled replacement-download campaign for an existing media library"

[project.scripts]
media-optimizer = "media_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
