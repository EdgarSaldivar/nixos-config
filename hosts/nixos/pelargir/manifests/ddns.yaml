apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddns-updater
  namespace: home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ddns-updater
  template:
    metadata:
      labels:
        app: ddns-updater
    spec:
      # Tolerate the standard control-plane taint that pelargir carries (see
      # hosts/nixos/pelargir/k3s.nix). The taint exists to keep MIGRATED media
      # workloads off this 8 GB ARM Pi during the k3s migration; these four are
      # the workloads that genuinely belong here and must keep scheduling.
      #
      # ⚠️  Ordering matters: this toleration is applied BEFORE the taint is
      # added. A toleration for a taint that does not exist yet is a harmless
      # no-op, whereas adding the taint first would strand these pods on their
      # next restart. NoSchedule does not evict running pods, so nothing moves
      # when the taint lands -- but a restart without this would not come back.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: pelargir
      containers:
        - name: ddns-updater
          image: docker.io/qmcgaw/ddns-updater@sha256:3e2aa558946b5a293def4d73008fa4651c072b2c12932cecd02126fb23979831
          imagePullPolicy: IfNotPresent
          env:
            # The image is distroless -- it has no /bin/sh, so the previous
            # initContainer that copied config.json in could never start
            # (verified on hardware 2026-08-05: stat /bin/sh: no such file).
            # ddns-updater reads its config path from CONFIG_FILEPATH, so mount
            # the Secret read-only and keep the writable emptyDir for its state.
            - name: CONFIG_FILEPATH
              value: /config/config.json
            - name: PERIOD
              value: 5m
            - name: UPDATE_COOLDOWN_PERIOD
              value: 5m
          volumeMounts:
            - name: data
              mountPath: /updater/data
            - name: config-seed
              mountPath: /config
              readOnly: true
      volumes:
        - name: config-seed
          secret:
            secretName: ddns-updater-config
        - name: data
          emptyDir: {}
