apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: home
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    persistence true
    persistence_location /mosquitto/data/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: home
spec:
  replicas: 1
  strategy:
    # hostNetwork port 1883 and the local-path RWO data volume are exclusive.
    # Recreate deliberately trades a brief rollout outage for avoiding two pods contending.
    type: Recreate
    # Explicit null removes server-defaulted surge settings during apply.
    rollingUpdate: null
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: pelargir
      initContainers:
        - name: build-password-file
          image: docker.io/library/eclipse-mosquitto@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mosquitto_passwd -b -c /auth/passwd homeassistant "$MOSQUITTO_PASSWORD"
              # The init container runs as root, so mosquitto_passwd creates the
              # file root-owned 0600. The main container runs as the unprivileged
              # mosquitto user (uid 1883) and could not read it -- verified on
              # hardware 2026-08-05: "Error: Unable to open pwfile". Hand it over.
              chown 1883:1883 /auth/passwd
              chmod 0400 /auth/passwd
          env:
            - name: MOSQUITTO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: password
          volumeMounts:
            - name: auth
              mountPath: /auth
      containers:
        - name: mosquitto
          image: docker.io/library/eclipse-mosquitto@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mqtt
            # Three seconds covers normal init after the startup gate without delaying service routing.
            initialDelaySeconds: 3
            # Ten-second checks with six misses tolerate a full minute of Pi 5 host pressure.
            periodSeconds: 10
            failureThreshold: 6
            # Five seconds avoids the aggressive one-second timeout under k3s contention.
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: mqtt
            # Five-second checks with twelve misses give password setup and broker recovery one minute.
            periodSeconds: 5
            failureThreshold: 12
            # Three seconds is ample for a local TCP connect while tolerating a busy control plane.
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: mqtt
            # Check every 30 seconds and require four misses: allow two minutes before restart.
            periodSeconds: 30
            failureThreshold: 4
            # Five seconds prevents false kills during transient host contention.
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: auth
          emptyDir:
            medium: Memory
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: home
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
