apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home
spec:
  replicas: 1
  strategy:
    # The coordinator CharDevice and local-path RWO data volume are exclusive.
    # Recreate deliberately trades a brief rollout outage for avoiding two pods contending.
    type: Recreate
    # Explicit null removes server-defaulted surge settings during apply.
    rollingUpdate: null
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Tolerate the standard control-plane taint that pelargir carries (see
      # hosts/nixos/pelargir/k3s.nix). The taint exists to keep MIGRATED media
      # workloads off this 8 GB ARM Pi during the k3s migration; these four are
      # the workloads that genuinely belong here and must keep scheduling.
      #
      # ⚠️  Ordering matters: this toleration is applied BEFORE the taint is
      # added. A toleration for a taint that does not exist yet is a harmless
      # no-op, whereas adding the taint first would strand these pods on their
      # next restart. NoSchedule does not evict running pods, so nothing moves
      # when the taint lands -- but a restart without this would not come back.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: pelargir
      initContainers:
        - name: seed-once
          image: docker.io/koenkk/zigbee2mqtt@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -e /data/.seeded ]; then
                cp /seed-config/configuration.yaml /data/configuration.yaml
                cp /seed-coordinator/coordinator_backup.json /data/coordinator_backup.json
                touch /data/.seeded
              fi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed-config
              mountPath: /seed-config
              readOnly: true
            - name: seed-coordinator
              mountPath: /seed-coordinator
              readOnly: true
      containers:
        - name: zigbee2mqtt
          image: docker.io/koenkk/zigbee2mqtt@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
          imagePullPolicy: IfNotPresent
          # Only this container is privileged, solely for the coordinator char
          # device. No other workload receives host-wide privileges.
          securityContext:
            privileged: true
            # Verified from this digest's linux/arm64 filesystem:
            # /etc/group contains dialout:x:20:root. This is defence-in-depth;
            # privileged access remains required for the device cgroup.
            runAsGroup: 20
          env:
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
              value: zstack
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
              value: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_c436272daea4ed11854ce8a32981d5c7-if00-port0
            - name: ZIGBEE2MQTT_CONFIG_PERMIT_JOIN
              value: "false"
            - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
              value: mqtt://localhost:1883
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED
              value: "true"
          ports:
            - name: frontend
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: frontend
            # Adapter initialization and network adoption get five minutes on this busy Pi 5.
            periodSeconds: 10
            failureThreshold: 30
            # Five seconds tolerates transient k3s CPU and I/O pressure during initialization.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: frontend
            # Check every 30 seconds and require six misses: allow three minutes for radio/host stalls.
            periodSeconds: 30
            failureThreshold: 6
            # A five-second HTTP timeout avoids false kills during control-plane contention.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: frontend
            # Check every 15 seconds and require four misses: tolerate one slow minute before withdrawal.
            periodSeconds: 15
            failureThreshold: 4
            # A five-second HTTP timeout is patient enough for the shared Pi 5.
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: coordinator
              mountPath: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_c436272daea4ed11854ce8a32981d5c7-if00-port0
            - name: udev
              mountPath: /run/udev
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: seed-config
          secret:
            secretName: zigbee2mqtt-config
        # The intact coordinator backup is non-secret recovery material, but is
        # deliberately supplied from the Mac at deploy time; see ZIGBEE-RECOVERY.
        - name: seed-coordinator
          secret:
            secretName: zigbee2mqtt-coordinator
        - name: coordinator
          hostPath:
            path: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_c436272daea4ed11854ce8a32981d5c7-if00-port0
            type: CharDevice
        - name: udev
          hostPath:
            path: /run/udev
            type: Directory
