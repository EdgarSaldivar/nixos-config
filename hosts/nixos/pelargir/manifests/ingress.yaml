# Require a client certificate signed by Cloudflare on every TLS connection.
#
# This REPLACES the ipAllowList middleware, which could not work here: the
# UniFi router SNATs forwarded traffic, so Traefik sees the router's address
# rather than Cloudflare's edge IP and no range ever matches (verified
# 2026-08-05 -- legitimate Cloudflare requests were rejected 403 while the
# same request with the ACL removed returned 200).
#
# mTLS is the stronger control regardless: it proves the connection came
# through Cloudflare cryptographically instead of inferring it from a source
# address that a direct-to-origin attacker could reach anyway.
#
# REQUIRES "Authenticated Origin Pulls" enabled on the zone, otherwise
# Cloudflare presents no certificate and every request fails the handshake.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: cloudflare-mtls
  namespace: home
spec:
  clientAuth:
    secretNames:
      - cloudflare-origin-pull-ca
    clientAuthType: RequireAndVerifyClientCert

# ⛔ The `cloudflare-only` ipAllowList Middleware was DELETED on 2026-08-16, and
# must not come back in this form.
#
# It could never work here, for the reason recorded above: the UniFi router SNATs
# forwarded traffic, so Traefik sees the router's address rather than Cloudflare's
# edge IP and no range ever matches. Verified 2026-08-05 -- legitimate Cloudflare
# requests were rejected 403 while the same request with the ACL removed returned
# 200. mTLS above replaced it and IS wired up, through this Ingress's annotation
# `router.tls.options: home-cloudflare-mtls@kubernetescrd`.
#
# So it was not merely redundant, it was a LOADED FOOTGUN: an object named
# `cloudflare-only`, live in the cluster and referenced by nothing, that silently
# 403s Home Assistant the moment someone reasonably assumes it is the origin
# protection and points a route at it.
#
# Deleting it collapses the Cloudflare range list to ONE source,
# hosts/nixos/pelargir/wireguard.nix -- ROADMAP item 7. checks/cloudflare-ranges.nix
# now guards that it STAYS one source instead of comparing two.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.options: home-cloudflare-mtls@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ha-pelargir.saldivar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant-external
                port:
                  number: 8123
  tls:
    - hosts:
        - homeassistant.pelargir.saldivar.io
      secretName: pelargir-wildcard-tls
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  # HelmChart fields verified against docs.k3s.io/helm on 2026-08-04.
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: 'v1.21.1'  # Pinned 2026-08-04; never float controller charts.
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: reflector
  namespace: kube-system
spec:
  # HelmChart fields verified against docs.k3s.io/helm on 2026-08-04.
  repo: https://emberstack.github.io/helm-charts
  chart: reflector
  version: '10.0.62'  # Pinned 2026-08-04; never float controller charts.
  targetNamespace: kube-system
---
# K3s applies manifest-directory resources without dependency ordering. These
# custom resources may be attempted before cert-manager installs its CRDs; the
# manifest controller retries failures, so this converges. The install runbook
# waits for both resources to become Ready instead of assuming first-pass order.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # ACME contact. Let's Encrypt rejects account registration outright if this
    # cannot be parsed as an email -- the placeholder left the ClusterIssuer
    # stuck at ErrRegisterACMEAccount and no certificate was ever issued
    # (found on hardware 2026-08-05). Same address the old Traefik deployment used.
    email: teremaire@gmail.com
    # Production is committed; for the first issuance attempt, use the clearly
    # marked staging URL below as described in docs/runbooks/pelargir/install.md.
    server: https://acme-v02.api.letsencrypt.org/directory
    # STAGING (first issuance only; avoids consuming production rate limits):
    # server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - selector:
          dnsZones:
            - saldivar.io
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pelargir-wildcard
  namespace: cert-manager
spec:
  secretName: pelargir-wildcard-tls
  secretTemplate:
    annotations:
      # Keys and namespace-list behavior verified against Emberstack Reflector
      # documentation and the working reference on 2026-08-04.
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: 'home'
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: 'home'
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # ha-pelargir is the PUBLIC name and must be first-class on this cert:
    # Cloudflare proxies it, and with SSL mode Full (strict) CF validates the
    # origin certificate for that exact hostname.
    #
    # Why not homeassistant.pelargir.saldivar.io any more: Cloudflare's free
    # Universal SSL covers the apex and ONE subdomain level only, so a
    # three-level name gets no edge certificate at all and the TLS handshake
    # fails before reaching us (verified 2026-08-05: sslv3 alert handshake
    # failure). Two-level names sidestep that entirely; the site stays encoded
    # in the label instead of the hierarchy.
    - ha-pelargir.saldivar.io
    - pelargir.saldivar.io
    - '*.pelargir.saldivar.io'
  privateKey:
    rotationPolicy: Always
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        # Preserve Cloudflare's source address for the Middleware ACL. This is
        # safe on the single-server cluster and avoids kube-proxy SNAT.
        externalTrafficPolicy: Local
