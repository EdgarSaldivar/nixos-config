apiVersion: v1
kind: Service
metadata:
  name: home-assistant-external
  namespace: home
spec:
  # No selector: a hostNetwork pod is a node listener, and a manual EndpointSlice
  # keeps Traefik pointed at the node LAN IP rather than pod churn. This address
  # REQUIRES the router DHCP reservation in INSTALL-RUNBOOK.md; the post-join
  # runbook-recorded Tailscale IP is a valid alternative.
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-external
  namespace: home
  labels:
    kubernetes.io/service-name: home-assistant-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - 10.0.0.165
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: home
  annotations:
    pelargir.saldivar.io/cloudflare-ranges-refreshed: "2026-08-03"
spec:
  # Refresh from https://www.cloudflare.com/ips/ alongside wireguard.nix.
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: home-cloudflare-only@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ha-pelargir.saldivar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant-external
                port:
                  number: 8123
  tls:
    - hosts:
        - homeassistant.pelargir.saldivar.io
      secretName: pelargir-wildcard-tls
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  # HelmChart fields verified against docs.k3s.io/helm on 2026-08-04.
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: 'v1.21.1'  # Pinned 2026-08-04; never float controller charts.
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: reflector
  namespace: kube-system
spec:
  # HelmChart fields verified against docs.k3s.io/helm on 2026-08-04.
  repo: https://emberstack.github.io/helm-charts
  chart: reflector
  version: '10.0.62'  # Pinned 2026-08-04; never float controller charts.
  targetNamespace: kube-system
---
# K3s applies manifest-directory resources without dependency ordering. These
# custom resources may be attempted before cert-manager installs its CRDs; the
# manifest controller retries failures, so this converges. The install runbook
# waits for both resources to become Ready instead of assuming first-pass order.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # ACME contact. Let's Encrypt rejects account registration outright if this
    # cannot be parsed as an email -- the placeholder left the ClusterIssuer
    # stuck at ErrRegisterACMEAccount and no certificate was ever issued
    # (found on hardware 2026-08-05). Same address the old Traefik deployment used.
    email: teremaire@gmail.com
    # Production is committed; for the first issuance attempt, use the clearly
    # marked staging URL below as described in INSTALL-RUNBOOK.md.
    server: https://acme-v02.api.letsencrypt.org/directory
    # STAGING (first issuance only; avoids consuming production rate limits):
    # server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - selector:
          dnsZones:
            - saldivar.io
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pelargir-wildcard
  namespace: cert-manager
spec:
  secretName: pelargir-wildcard-tls
  secretTemplate:
    annotations:
      # Keys and namespace-list behavior verified against Emberstack Reflector
      # documentation and the working reference on 2026-08-04.
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: 'home'
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: 'home'
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # ha-pelargir is the PUBLIC name and must be first-class on this cert:
    # Cloudflare proxies it, and with SSL mode Full (strict) CF validates the
    # origin certificate for that exact hostname.
    #
    # Why not homeassistant.pelargir.saldivar.io any more: Cloudflare's free
    # Universal SSL covers the apex and ONE subdomain level only, so a
    # three-level name gets no edge certificate at all and the TLS handshake
    # fails before reaching us (verified 2026-08-05: sslv3 alert handshake
    # failure). Two-level names sidestep that entirely; the site stays encoded
    # in the label instead of the hierarchy.
    - ha-pelargir.saldivar.io
    - pelargir.saldivar.io
    - '*.pelargir.saldivar.io'
  privateKey:
    rotationPolicy: Always
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        # Preserve Cloudflare's source address for the Middleware ACL. This is
        # safe on the single-server cluster and avoids kube-proxy SNAT.
        externalTrafficPolicy: Local
