apiVersion: v1
kind: Service
metadata:
  name: home-assistant-external
  namespace: home
spec:
  # No selector: a hostNetwork pod is a node listener, and a manual EndpointSlice
  # keeps Traefik pointed at the node LAN IP rather than pod churn. This address
  # REQUIRES the router DHCP reservation in docs/runbooks/pelargir/install.md; the post-join
  # runbook-recorded Tailscale IP is a valid alternative.
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-external
  namespace: home
  labels:
    kubernetes.io/service-name: home-assistant-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - 10.0.0.165
    conditions:
      ready: true
---
