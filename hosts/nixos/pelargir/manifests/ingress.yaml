apiVersion: v1
kind: Service
metadata:
  name: home-assistant-external
  namespace: home
spec:
  # No selector: a hostNetwork pod is a node listener, and a manual EndpointSlice
  # keeps Traefik pointed at the node LAN IP rather than pod churn. This address
  # REQUIRES the router DHCP reservation in INSTALL-RUNBOOK.md; the post-join
  # runbook-recorded Tailscale IP is a valid alternative.
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-external
  namespace: home
  labels:
    kubernetes.io/service-name: home-assistant-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - 10.0.0.165
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: home
  annotations:
    pelargir.saldivar.io/cloudflare-ranges-refreshed: "2026-08-03"
spec:
  # Refresh from https://www.cloudflare.com/ips/ alongside wireguard.nix.
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: home-cloudflare-only@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: pelargir.saldivar.io
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.pelargir.saldivar.io"
spec:
  ingressClassName: traefik
  rules:
    - host: homeassistant.pelargir.saldivar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant-external
                port:
                  number: 8123
  tls:
    - hosts:
        - homeassistant.pelargir.saldivar.io
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - --certificatesresolvers.cloudflare.acme.email=REPLACE-AT-DEPLOY
      - --certificatesresolvers.cloudflare.acme.storage=/data/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
    env:
      - name: CF_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: traefik-cloudflare
            key: CF_DNS_API_TOKEN
    persistence:
      enabled: true
      name: data
      size: 128Mi
      path: /data
    service:
      spec:
        # Preserve Cloudflare's source address for the Middleware ACL. This is
        # safe on the single-server cluster and avoids kube-proxy SNAT.
        externalTrafficPolicy: Local
