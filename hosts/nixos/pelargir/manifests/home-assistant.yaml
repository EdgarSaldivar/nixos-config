apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home
spec:
  replicas: 1
  strategy:
    # hostNetwork port 8123 and the local-path RWO config volume are exclusive.
    # Recreate deliberately trades a brief rollout outage for avoiding two pods contending.
    type: Recreate
    # Explicit null removes server-defaulted surge settings during apply.
    rollingUpdate: null
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: pelargir
      containers:
        - name: home-assistant
          # Restore boot is intentionally frozen here. Follow the checkpointed
          # upgrade ladder in ZIGBEE-RECOVERY.md before changing this digest.
          image: ghcr.io/home-assistant/home-assistant@sha256:c01d6c54679a1934a2bd62a8e3289cd1439b45b82dc5b2dba01793368c500908
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            # A restored 2024.11.1 config and SQLite migration may take 15 minutes on this busy Pi 5.
            periodSeconds: 10
            failureThreshold: 90
            # Five seconds tolerates transient k3s CPU and I/O pressure without a false failure.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            # Check every 30 seconds and require six misses: allow three minutes for host contention.
            periodSeconds: 30
            failureThreshold: 6
            # A five-second HTTP timeout is patient under Pi 5 control-plane load.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            # Check every 15 seconds and require four misses: withdraw only after one slow minute.
            periodSeconds: 15
            failureThreshold: 4
            # A five-second HTTP timeout avoids marking brief host pressure unready.
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
