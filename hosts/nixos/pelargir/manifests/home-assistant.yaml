apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home
spec:
  replicas: 1
  strategy:
    # hostNetwork port 8123 and the local-path RWO config volume are exclusive.
    # Recreate deliberately trades a brief rollout outage for avoiding two pods contending.
    type: Recreate
    # Explicit null removes server-defaulted surge settings during apply.
    rollingUpdate: null
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Tolerate the standard control-plane taint that pelargir carries (see
      # hosts/nixos/pelargir/k3s.nix). The taint exists to keep MIGRATED media
      # workloads off this 8 GB ARM Pi during the k3s migration; these four are
      # the workloads that genuinely belong here and must keep scheduling.
      #
      # ⚠️  Ordering matters: this toleration is applied BEFORE the taint is
      # added. A toleration for a taint that does not exist yet is a harmless
      # no-op, whereas adding the taint first would strand these pods on their
      # next restart. NoSchedule does not evict running pods, so nothing moves
      # when the taint lands -- but a restart without this would not come back.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: pelargir
      containers:
        - name: home-assistant
          # Restore boot is intentionally frozen here. Follow the checkpointed
          # upgrade ladder in ZIGBEE-RECOVERY.md before changing this digest.
          image: ghcr.io/home-assistant/home-assistant@sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            # A restored 2024.11.1 config and SQLite migration may take 15 minutes on this busy Pi 5.
            periodSeconds: 10
            failureThreshold: 90
            # Five seconds tolerates transient k3s CPU and I/O pressure without a false failure.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            # Check every 30 seconds and require six misses: allow three minutes for host contention.
            periodSeconds: 30
            failureThreshold: 6
            # A five-second HTTP timeout is patient under Pi 5 control-plane load.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            # Check every 15 seconds and require four misses: withdraw only after one slow minute.
            periodSeconds: 15
            failureThreshold: 4
            # A five-second HTTP timeout avoids marking brief host pressure unready.
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
