# lidarr — part of the atomic media wave.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: media
  labels:
    app: lidarr
spec:
  # LIVE — and this value must keep MATCHING THE CLUSTER. It read `replicas: 0`
  # while the Deployment ran at 1, from its cutover until 2026-08-08, because the
  # cutover used `kubectl scale` instead of changing this line. k3s auto-deploy
  # re-applies a manifest when its file checksum changes OR when the server
  # restarts, so either event would have reasserted the declared 0 and taken the
  # service down with nothing in git to explain it. Hand-scaling survived ordinary
  # rebuilds only because installing byte-identical content does not change the
  # checksum — which is exactly what kept this invisible.
  # See docs/architecture/k3s.md, "Durable state belongs in git".
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  strategy:
    # A rolling pair would share the SQLite state under /config.
    type: Recreate
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      # These directories exist only on minas' ZFS. Do not fall back to another node
      # with an empty library.
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      initContainers:
        # Lidarr currently has no managed artists, but prove its intended future root
        # before allowing it to accept any download.
        - name: verify-hardlinks
          image: lscr.io/linuxserver/lidarr@sha256:bfec0ec2dc351fa5928379d785b08be395886f109393b9040ed7973bd1008060
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              source=/storage/Media/Torrents/completed/.lidarr-hardlink-preflight-$$
              music=/storage/Media/Music/.lidarr-hardlink-preflight-$$
              cleanup() { rm -f "$source" "$music"; }
              trap cleanup EXIT HUP INT TERM
              : > "$source"
              ln "$source" "$music"
              expected=$(stat -c '%d:%i' "$source")
              [ "$(stat -c '%d:%i' "$music")" = "$expected" ]
              [ "$(stat -c '%h' "$source")" -eq 2 ]
              echo "hardlink preflight passed: device:inode=$expected links=2"
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: media, mountPath: /storage/Media }
      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr@sha256:bfec0ec2dc351fa5928379d785b08be395886f109393b9040ed7973bd1008060
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8686
              # Compose published this port, so removing direct access would be a
              # migration regression even though ingress also reaches the Service.
              hostPort: 8686
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: America/Los_Angeles }
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          # The live authenticated application returned 200 on /ping without auth.
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /config }
            # Lidarr currently has no root folder or managed artists. Put its future
            # /storage/Media/Music library and Deluge downloads below one bind mount so
            # imports can hardlink instead of crossing filesystems.
            - { name: media, mountPath: /storage/Media }
      volumes:
        # Directory makes stale or mistyped inventory fail instead of manufacturing
        # an empty tree that looks like missing data.
        - name: config
          hostPath: { path: /etc/lidarr/data, type: Directory }
        - name: media
          hostPath: { path: /storage/Media, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: media
  labels:
    app: lidarr
spec:
  selector:
    app: lidarr
  ports:
    - { name: http, port: 8686, targetPort: http }
