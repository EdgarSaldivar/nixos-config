      - model: authentik_providers_proxy.proxyprovider
        id: provider-bt
        state: present
        identifiers: { name: Minas ForwardAuth - BT }
        attrs:
          mode: forward_single
          external_host: https://bt.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-bt
        state: present
        identifiers: { slug: bt }
        attrs:
          name: BT
          provider: !KeyOf provider-bt
          group: Download administration
          meta_launch_url: https://bt.saldivar.io
          meta_description: Media download administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-bt
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      - model: authentik_providers_proxy.proxyprovider
        id: provider-btbooks
        state: present
        identifiers: { name: Minas ForwardAuth - BT Books }
        attrs:
          mode: forward_single
