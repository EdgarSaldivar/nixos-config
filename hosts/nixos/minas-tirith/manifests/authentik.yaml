            - { name: AUTHENTIK_POSTGRESQL__NAME, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__USER, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__PORT, value: "5432" }
            - { name: AUTHENTIK_POSTGRESQL__SSLMODE, value: disable }
            - { name: AUTHENTIK_LISTEN__HTTP, value: "0.0.0.0:9000" }
            - { name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS, value: "127.0.0.0/8,10.42.1.0/24" }
            - { name: AUTHENTIK_ERROR_REPORTING__ENABLED, value: "false" }
            - { name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true" }
            - { name: AUTHENTIK_OUTPOSTS__DISCOVER, value: "false" }
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet: { path: /-/health/live/, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /-/health/ready/, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /-/health/live/, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: authentik-data, mountPath: /data }
            - { name: authentik-secrets, mountPath: /run/secrets/authentik, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: authentik-data
          persistentVolumeClaim: { claimName: authentik-data }
        - name: authentik-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: authentik-secrets
                  items:
                    - { key: secret-key, path: secret-key, mode: 0440 }
                    - { key: postgres-password, path: postgres-password, mode: 0440 }
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
# Every Authentik Pod is denied by default. The following policies add only the
# named in-cluster flows and the one explicit public-host self-callback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: authentik
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-to-server
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app: traefik
      ports:
        - { protocol: TCP, port: 9000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-worker-to-postgresql
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [authentik]
              - key: app.kubernetes.io/component
                operator: In
                values: [server, worker]
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-worker-egress-postgresql
  namespace: authentik
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [authentik]
      - key: app.kubernetes.io/component
        operator: In
        values: [server, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik-postgresql
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-worker-egress-dns
  namespace: authentik
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [authentik]
      - key: app.kubernetes.io/component
        operator: In
        values: [server, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-egress-public-auth-callback
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes: [Egress]
  egress:
    # Narrow exception for the embedded outpost's https://auth.saldivar.io callback.
    - to:
        - ipBlock:
            cidr: 10.0.1.6/32
      ports:
        - { protocol: TCP, port: 443 }
