# authentik Phase A foundation — ACTIVE.
#
# PostgreSQL, the worker, and the server declare the accepted steady-state replica count
# of 1. The initial rollout used committed DB -> worker -> server promotion waves. Any
# later shutdown reverses those waves in committed changes; never use `kubectl scale`
# and leave imperative drift for k3s auto-deploy to erase later.
# The authentik Namespace and the sops-rendered authentik-secrets Secret are created
# elsewhere. This file contains no secret values and no Secret object.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-custom-blueprints
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
data:
  minas-passkey-first.yaml: |
    version: 1
    metadata:
      name: Minas Tirith - passkey-first authentication
      labels:
        blueprints.goauthentik.io/description: Passkey autofill with password fallback
    entries:
      # Make the packaged flows explicit dependencies so a fresh database applies them
      # before this blueprint links their stages together. Device enrollment remains
      # stateful Authentik data and is protected by the encrypted database backup.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - WebAuthn MFA setup flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Static MFA setup flow
          required: true

      # Authentik 2026.5's packaged authentication flow already has policies that skip
      # the password stage and the later MFA stage after successful passwordless WebAuthn.
      # Linking the validator here enables conditional passkey UI while retaining the
      # username/password path as a recovery-compatible fallback.
      - model: authentik_stages_identification.identificationstage
        state: present
        identifiers:
          name: default-authentication-identification
        attrs:
          # Restate the packaged identifiers because Authentik validates this serializer
          # as a complete object even when `state: present` finds the existing stage.
          user_fields: [email, username]
          webauthn_stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]

  minas-admin-forward-auth.yaml: |
    version: 1
    metadata:
      name: Minas Tirith - definite admin ForwardAuth applications
      labels:
        blueprints.goauthentik.io/description: Definite admin hosts only
    entries:
      # `created` preserves an existing installation's group. On a fresh database it
      # creates the conventional superuser group used by every binding below.
      - model: authentik_core.group
        id: authentik-admins
        state: created
        identifiers:
          name: authentik Admins
        attrs:
          is_superuser: true

      - model: authentik_providers_proxy.proxyprovider
        id: provider-traefik
        state: present
        identifiers: { name: Minas ForwardAuth - Traefik }
        attrs:
          mode: forward_single
          external_host: https://traefik.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-traefik
        state: present
        identifiers: { slug: traefik }
        attrs:
          name: Traefik
          provider: !KeyOf provider-traefik
          group: Infrastructure administration
          meta_launch_url: https://traefik.saldivar.io
          meta_description: Edge router administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-traefik
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      - model: authentik_providers_proxy.proxyprovider
        id: provider-maintainerr
        state: present
        identifiers: { name: Minas ForwardAuth - Maintainerr }
        attrs:
          mode: forward_single
          external_host: https://maintainerr.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-maintainerr
        state: present
        identifiers: { slug: maintainerr }
        attrs:
          name: Maintainerr
          provider: !KeyOf provider-maintainerr
          group: Media administration
          meta_launch_url: https://maintainerr.saldivar.io
          meta_description: Media maintenance administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-maintainerr
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      - model: authentik_providers_proxy.proxyprovider
        id: provider-sonarr
        state: present
        identifiers: { name: Minas ForwardAuth - Sonarr }
        attrs:
          mode: forward_single
          external_host: https://sonarr.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-sonarr
        state: present
        identifiers: { slug: sonarr }
        attrs:
          name: Sonarr
          provider: !KeyOf provider-sonarr
          group: Media administration
          meta_launch_url: https://sonarr.saldivar.io
          meta_description: TV library administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-sonarr
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      - model: authentik_providers_proxy.proxyprovider
        id: provider-radarr
        state: present
        identifiers: { name: Minas ForwardAuth - Radarr }
        attrs:
          mode: forward_single
          external_host: https://radarr.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-radarr
        state: present
        identifiers: { slug: radarr }
        attrs:
          name: Radarr
          provider: !KeyOf provider-radarr
          group: Media administration
          meta_launch_url: https://radarr.saldivar.io
          meta_description: Movie library administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-radarr
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      - model: authentik_providers_proxy.proxyprovider
        id: provider-lidarr
        state: present
        identifiers: { name: Minas ForwardAuth - Lidarr }
        attrs:
          mode: forward_single
          external_host: https://lidarr.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-lidarr
        state: present
        identifiers: { slug: lidarr }
        attrs:
          name: Lidarr
          provider: !KeyOf provider-lidarr
          group: Media administration
          meta_launch_url: https://lidarr.saldivar.io
          meta_description: Music library administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-lidarr
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      - model: authentik_providers_proxy.proxyprovider
        id: provider-anime
        state: present
        identifiers: { name: Minas ForwardAuth - Anime }
        attrs:
          mode: forward_single
          external_host: https://anime.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-anime
        state: present
        identifiers: { slug: anime }
        attrs:
          name: Anime
          provider: !KeyOf provider-anime
          group: Media administration
          meta_launch_url: https://anime.saldivar.io
          meta_description: Anime library administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-anime
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      - model: authentik_providers_proxy.proxyprovider
        id: provider-prowlarr
        state: present
        identifiers: { name: Minas ForwardAuth - Prowlarr }
        attrs:
          mode: forward_single
          external_host: https://prowlarr.saldivar.io
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: app-prowlarr
        state: present
        identifiers: { slug: prowlarr }
