          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-books-dl
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
        attrs: { enabled: true, negate: false }

      # The embedded outpost is an in-process proxy outpost. This single declarative
      # assignment is authoritative for the complete provider set above.
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          name: authentik Embedded Outpost
          type: proxy
          providers:
            - !KeyOf provider-traefik
            - !KeyOf provider-maintainerr
            - !KeyOf provider-sonarr
            - !KeyOf provider-radarr
            - !KeyOf provider-lidarr
            - !KeyOf provider-anime
            - !KeyOf provider-prowlarr
            - !KeyOf provider-bt
            - !KeyOf provider-btbooks
            - !KeyOf provider-books-dl
          config:
            authentik_host: https://auth.saldivar.io
            authentik_host_browser: https://auth.saldivar.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgresql
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-postgresql
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-data
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgresql
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: authentik-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgresql
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-postgresql
spec:
  # ACTIVE. Scale down only after server and worker are declaratively stopped.
  replicas: 1
  serviceName: authentik-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-postgresql
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        # Keep this name: backup discovery derives k8s-authentik-authentik-postgresql.
        - name: authentik-postgresql
          image: docker.io/library/postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: authentik }
            - { name: POSTGRES_DB, value: authentik }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgresql/postgres-password }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
          startupProbe:
            exec: { command: [pg_isready, -U, authentik, -d, authentik] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: [pg_isready, -U, authentik, -d, authentik] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: [pg_isready, -U, authentik, -d, authentik] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: postgresql-secret, mountPath: /run/secrets/postgresql, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: authentik-postgresql }
        - name: postgresql-secret
          secret:
            secretName: authentik-secrets
            defaultMode: 0440
            items:
              - { key: postgres-password, path: postgres-password, mode: 0440 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: worker
spec:
  # ACTIVE. Scale down after the server and before PostgreSQL.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  strategy: { type: Recreate }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
          imagePullPolicy: IfNotPresent
          args: [worker]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: AUTHENTIK_SECRET_KEY, value: "file:///run/secrets/authentik/secret-key" }
            - { name: AUTHENTIK_POSTGRESQL__PASSWORD, value: "file:///run/secrets/authentik/postgres-password" }
            - { name: AUTHENTIK_POSTGRESQL__HOST, value: authentik-postgresql }
            - { name: AUTHENTIK_POSTGRESQL__NAME, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__USER, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__PORT, value: "5432" }
            - { name: AUTHENTIK_POSTGRESQL__SSLMODE, value: disable }
            - { name: AUTHENTIK_LISTEN__HTTP, value: "0.0.0.0:9000" }
            - { name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS, value: "127.0.0.0/8,10.42.1.0/24" }
            - { name: AUTHENTIK_ERROR_REPORTING__ENABLED, value: "false" }
            - { name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true" }
            - { name: AUTHENTIK_OUTPOSTS__DISCOVER, value: "false" }
            - { name: AUTHENTIK_BOOTSTRAP_EMAIL, value: teremaire@gmail.com }
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: bootstrap-password-hash
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
              ephemeral-storage: 512Mi
          startupProbe:
            exec: { command: [ak, healthcheck] }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec: { command: [ak, healthcheck] }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec: { command: [ak, healthcheck] }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: authentik-data, mountPath: /data }
            - { name: authentik-secrets, mountPath: /run/secrets/authentik, readOnly: true }
            # Mount the ConfigMap as the whole custom directory. Never use subPath and
            # never shadow /blueprints, which contains Authentik's packaged blueprints.
            - { name: custom-blueprints, mountPath: /blueprints/custom, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: authentik-data
          persistentVolumeClaim: { claimName: authentik-data }
        - name: authentik-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: authentik-secrets
                  items:
                    - { key: secret-key, path: secret-key, mode: 0440 }
                    - { key: postgres-password, path: postgres-password, mode: 0440 }
        - name: custom-blueprints
          configMap:
            name: authentik-custom-blueprints
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
