          name: Prowlarr
          provider: !KeyOf provider-prowlarr
          group: Download administration
          meta_launch_url: https://prowlarr.saldivar.io
          meta_description: Indexer administration
          meta_hide: false
          open_in_new_tab: true
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-prowlarr
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
