# Cleanuparr is intentionally an internal, report-only guardrail. `deluge-vpn` may carry
# both public and private torrents, so client-wide deletion is unsafe. Do not enable
# deletion unless Cleanuparr can positively select public torrents and exclude every
# private tracker. Never add deluge-books.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr
  namespace: media
  labels:
    app: cleanuparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cleanuparr
  strategy:
    # The SQLite database is single-writer state on a hostPath.
    type: Recreate
  template:
    metadata:
      labels:
        app: cleanuparr
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanuparr
          # 2.10.3; this is also the verified latest index digest on 2026-08-10.
          image: ghcr.io/cleanuparr/cleanuparr@sha256:31f93b0f8eff9fe87c5cb7779276905144bc297b1a67cd77887d8eb168b1af2a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11011
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: UMASK, value: "022" }
            - { name: TZ, value: America/Los_Angeles }
            - { name: HTTP_PORTS, value: "11011" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          hostPath:
            path: /usr/local/etc/cleanuparr
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cleanuparr
  namespace: media
  labels:
    app: cleanuparr
spec:
  type: ClusterIP
  selector:
    app: cleanuparr
  ports:
    - { name: http, port: 11011, targetPort: http }
