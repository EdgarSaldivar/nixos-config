# deluge-books — the first VPN-gated workload built as a DESIGN rather than a port.
#
# Replaces binhex/arch-delugevpn (privileged: true, CapEff 000001ffffffffff — every
# capability the kernel has, a bespoke init.sh kill-switch, credentials written to disk,
# and a MyAnonaMouse session cookie in argv) with a gluetun native sidecar and a plain
# Deluge container holding no network capabilities at all.
#
# Read K3S-VPN-STACK-DESIGN.md before changing anything here. Every value below that looks
# arbitrary was MEASURED on a live test rig on 2026-08-09, and the document records what
# broke without it.
#
# ⛔ STAGED AT replicas: 0. Nothing here is live. The Deployment is inert and there is
# deliberately NO Service in this file yet — adding a Service while docker still serves
# `deluge-books` would break prowlarr, and this repo has been bitten by exactly that.
# The Service, the traefik route and the EndpointSlice deletion all land in the CUTOVER
# commit, together, after docker stops.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mam-registrar
  namespace: media
data:
  # MAM sessions are IP-BOUND. gluetun's exit IP changes on every reconnect — MEASURED:
  # 212.56.48.64 -> 158.173.21.76 across a single restart. Without this, MAM access breaks
  # at the next reconnect, silently, long after cutover and looking unrelated.
  #
  # ⛔ Watches the PUBLIC IP FILE, not gluetun's port-forward hook. The hook fires on
  # "port forwarding established", which is a different event — registration would stop
  # silently if forwarding failed while egress stayed usable.
  #
  # ⛔ The cookie is read from the mounted Secret INSIDE this script and passed to curl
  # via a config file on stdin, never as an argv element. Putting it in argv is exactly
  # how it leaked into docker's Cmd and became visible to `docker inspect`.
  #
  # ⚠️ WHY THE ROTATED COOKIE IS NOT PERSISTED. MAM returns a NEW mam_id in Set-Cookie on
  # every successful call. We deliberately keep replaying the sops seed instead, because:
  #   - MEASURED: MAM accepts the same cookie repeatedly and simply refreshes its
  #     Max-Age. The seed has been reused across many successful calls.
  #   - persisting it to disk would put a live credential back on an unencrypted hostPath,
  #     which is the exact property this migration removed.
  #   - persisting it to a Secret via the API is IMPOSSIBLE for this Pod BY DESIGN: it has
  #     dnsPolicy None (no cluster DNS), gluetun DROPs 10.43.0.0/16, and the hardening
  #     container DROPs the Pod subnet. Reaching 10.43.0.1 would mean punching a hole in
  #     the containment. Not worth it for a convenience.
  # So the seed is kept ALIVE by the periodic refresh below rather than replaced.
  # ⛔ If MAM ever starts rejecting a replayed cookie, this assumption breaks and the
  # startup gate will block Deluge — which is the loud failure, not a silent one.
  register.sh: |
    #!/bin/sh
    set -u
    IPFILE=/shared/ip
    MARKER=/shared/.mam-registered-ip
    COOKIE_FILE=/run/secrets/session-cookie
    backoff=5

    log() { echo "[mam-registrar] $*"; }

    # ⛔ STRICT IPv4. An earlier version used `case $ip in *[!0-9.]*)` which ACCEPTS
    # partial reads like "212.56." — exactly what gluetun's non-atomic rewrite produces.
    valid_ip() {
      printf '%s' "$1" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$' || return 1
      o1=${1%%.*}; r=${1#*.}; o2=${r%%.*}; r=${r#*.}; o3=${r%%.*}; o4=${r##*.}
      for o in "$o1" "$o2" "$o3" "$o4"; do
        [ "$o" -ge 0 ] 2>/dev/null && [ "$o" -le 255 ] || return 1
      done
      return 0
    }

    register() {
      # ⛔ --fail only rejects HTTP >= 400. This endpoint returns 200 with an
      # APPLICATION-level error, so an earlier version wrote the marker and started Deluge
      # against an unregistered IP. Parse the body and require a documented success.
      #
      # ⛔ Bounded timeouts: without them a stalled request blocks this loop forever and
      # every later exit-IP change goes unregistered, with nothing observably wrong.
      body=$(printf 'cookie = "mam_id=%s"\nurl = "https://t.myanonamouse.net/json/dynamicSeedbox.php"\nsilent\nshow-error\nconnect-timeout = 15\nmax-time = 45\n' \
        "$(cat "$COOKIE_FILE")" | curl --config - 2>/dev/null)
      case "$body" in
        *'"Success":true'*|*'"success":true'*|*'No Change'*|*'no change'*) return 0 ;;
        *) log "unexpected response from MAM (body suppressed; it can echo session data)"; return 1 ;;
      esac
    }

    # ⛔ REFRESH EVEN WHEN THE IP HAS NOT CHANGED. MEASURED 2026-08-09: MAM's
    # Set-Cookie carries Max-Age=1296000 — the session expires 15 DAYS after its last
    # use. An earlier version only called MAM on an IP CHANGE, so a stable tunnel meant
    # no calls at all and the session died on a timer. That is exactly how the cookie
    # inherited from docker was already dead before this migration started.
    #
    # 6 days, comfortably inside the 15-day window even if several refreshes fail.
    REFRESH_SECONDS=518400
    last_call=0

    now() { date +%s; }

    while :; do
      # gluetun TRUNCATES this file to empty on disconnect and rewrites it
      # non-atomically. Ignore empty/partial reads or we submit garbage transitions.
      ip=$(cat "$IPFILE" 2>/dev/null | tr -d ' \n\r')
      if ! valid_ip "$ip"; then sleep 5; continue; fi

      last=$(cat "$MARKER" 2>/dev/null || true)
      age=$(( $(now) - last_call ))
      if [ "$ip" = "$last" ] && [ "$age" -lt "$REFRESH_SECONDS" ]; then
        backoff=5; sleep 30; continue
      fi
      [ "$ip" = "$last" ] && log "periodic refresh (session expires 15d after last use)"

      if register "$ip"; then
        last_call=$(now)
        # The marker records WHICH ip is registered, so the health check below can compare
        # it against the current one. ⚠️ It is NOT a durable backoff store: before the
        # first success the startupProbe will restart this container and reset backoff.
        # That is bounded by the probe's failureThreshold and is preferable to Deluge
        # starting against an unregistered IP.
        printf '%s' "$ip" > "$MARKER"
        log "registered new exit IP"
        backoff=5
      else
        log "registration failed; retrying in ${backoff}s"
        sleep "$backoff"
        backoff=$(( backoff * 2 ))
        [ "$backoff" -gt 300 ] && backoff=300
      fi
    done
  # Liveness/health: the marker must match the CURRENT exit IP. A stale nonempty marker
  # would otherwise satisfy a mere test -s forever while registration was actually dead.
  registered.sh: |
    #!/bin/sh
    set -u
    cur=$(cat /shared/ip 2>/dev/null | tr -d ' \n\r')
    reg=$(cat /shared/.mam-registered-ip 2>/dev/null | tr -d ' \n\r')
    [ -n "$reg" ] || exit 1
    # During a reconnect the IP file is briefly empty; do not flap on that.
    [ -z "$cur" ] && exit 0
    [ "$cur" = "$reg" ]
  # ⛔ PIA's forwarded port changes on every allocation and every reconnect. Without this
  # Deluge is Ready, serves its UI, and announces a STALE peer port — inbound peers simply
  # never connect, which looks like "slow torrents", not like a fault. gluetun writes the
  # port; nothing was consuming it.
  # ⛔ PIA's forwarded port changes on every allocation and every reconnect. Without this
  # Deluge is Ready, serves its UI, and announces a STALE peer port — inbound peers never
  # connect, which looks like "slow torrents" rather than a fault.
  #
  # ⛔ Uses the RPC API, NOT `deluge-console`. Measured 2026-08-09: deluge-console in 2.2.0
  # needs a writable $HOME/.config (fails with EACCES on /home/nobody), and once given one
  # it dies non-interactively with
  #   'ConsoleUI' object has no attribute 'started_deferred'
  # The RPC path has neither problem and is what the evidence tooling already uses.
  setport.py: |
    import ipaddress, sys, traceback
    from twisted.internet import reactor
    from twisted.internet.defer import inlineCallbacks
    from deluge.ui.client import client
    rc = 1
    def auth():
        with open('/config/auth', encoding='utf-8') as fh:
            for line in fh:
                line = line.strip()
                if line and not line.startswith('#'):
                    p = line.split(':')
                    if len(p) >= 2:
                        return p[0], p[1]
        raise RuntimeError('no credential in /config/auth')
    @inlineCallbacks
    def main():
        global rc
        try:
            port = int(sys.argv[1])
            if not (1024 <= port <= 65535):
                raise ValueError('port out of range')
            listen_ip = str(ipaddress.IPv4Address(sys.argv[2]))
            u, pw = auth()
            yield client.connect('127.0.0.1', 58846, u, pw)
            # The migrated core.conf pins listen_interface to the old Docker tunnel
            # address. Keep both halves of the peer endpoint aligned with gluetun:
            # random_port=False prevents Deluge overriding PIA's allocation, while the
            # live tun0 address prevents libtorrent binding a vanished interface.
            yield client.core.set_config({
                'random_port': False,
                'listen_ports': [port, port],
                'listen_interface': listen_ip,
                'outgoing_interface': 'tun0',
            })
            cfg = yield client.core.get_config_values([
                'listen_ports', 'random_port', 'listen_interface', 'outgoing_interface'
            ])
            got = list(cfg.get('listen_ports') or [])
            if (
                got == [port, port]
                and not cfg.get('random_port')
                and cfg.get('listen_interface') == listen_ip
                and cfg.get('outgoing_interface') == 'tun0'
            ):
                rc = 0
            else:
                sys.stderr.write('verify failed: %r\n' % (cfg,))
        except Exception:
            traceback.print_exc(file=sys.stderr)
        finally:
            try: client.disconnect()
            except Exception: pass
            reactor.stop()
    reactor.callWhenRunning(main)
    reactor.run()
    raise SystemExit(rc)
  portsync.sh: |
    #!/bin/sh
    set -u
    PORTFILE=/shared/forwarded_port
    MARKER=/shared/.deluge-listen-endpoint
    log() { echo "[portsync] $*"; }

    while :; do
      port=$(cat "$PORTFILE" 2>/dev/null | tr -d ' \n\r')
      case "$port" in
        ''|*[!0-9]*) sleep 15; continue ;;
      esac
      [ "$port" -ge 1024 ] 2>/dev/null && [ "$port" -le 65535 ] || { sleep 15; continue; }

      # Pods share one network namespace, so this is the same tun0 Deluge uses.
      # Require exactly one global IPv4 address; blank means the tunnel is absent or
      # transitioning and must never be recorded as synchronized.
      tun_ip=$(ip -4 -o addr show dev tun0 scope global 2>/dev/null \
        | awk '{ sub(/\/.*/, "", $4); addresses[++n] = $4 }
               END { if (n == 1) print addresses[1] }')
      [ -n "$tun_ip" ] || { sleep 15; continue; }

      # Include the tunnel address in the marker. PIA can reuse a forwarded port after
      # reconnecting with a different tun0 address; a port-only marker misses that event.
      endpoint="${port}@${tun_ip}"
      if [ "$endpoint" = "$(cat "$MARKER" 2>/dev/null || true)" ]; then sleep 30; continue; fi

      # Verifies every value by reading it back; only then records the marker.
      if python3 /scripts/setport.py "$port" "$tun_ip" 2>/dev/null; then
        printf '%s' "$endpoint" > "$MARKER"
        log "listen endpoint synced to forwarded port and tunnel interface"
        sleep 30
      else
        log "failed to set listen endpoint; retrying"
        sleep 15
      fi
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-books
  namespace: media
  labels:
    app: deluge-books
spec:
  # LIVE since the cutover of 2026-08-09, raised here in git after docker stopped and the
  # state tree was cold-copied to /usr/local/etc/deluge-books-k3s.
  #
  # ⚠️ The Pod was started IMPERATIVELY first (kubectl scale) and fully accepted while the
  # bridge still pointed at stopped docker and an ingress fence held admission closed. This
  # declarative value then CAUGHT UP to reality. Publishing and scaling in one commit would
  # have meant unwinding a committed two-host change on any failure.
  replicas: 1
  selector:
    matchLabels:
      app: deluge-books
  # Two Deluge processes on one state tree is how 47 torrents' queue, labels, ratios and
  # resume data are lost.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: deluge-books
    spec:
      # hostPaths are local to minas; without this the scheduler could place this on
      # pelargir and `type: Directory` would leave it Pending forever.
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # ⛔ THE APP MUST RESOLVE VIA GLUETUN, NEVER CoreDNS. Pods default to CoreDNS, and
      # CoreDNS has its own non-VPN egress — so a default-policy Pod leaks DNS (and DNS
      # tunnelling carries arbitrary data) whenever the tunnel is down. MEASURED working:
      # the app container's resolv.conf reads `nameserver 127.0.0.1` and resolution goes
      # over the tunnel.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
      initContainers:
        # ---------------------------------------------------------------------------
        #  0. shared-state ownership — make gluetun reconnects restart-safe
        # ---------------------------------------------------------------------------
        # EmptyDir starts root:root 1777. gluetun writes its status files as UID 1000,
        # but its supervisor is root. With minas' fs.protected_regular=1, root cannot
        # reopen a UID-1000 file with O_CREAT inside a root-owned sticky directory.
        # The first VPN reconnect therefore failed to replace /shared/ip and
        # /shared/forwarded_port with EACCES, leaving portsync a stale allocation.
        #
        # Make the directory owner match gluetun's file owner while RETAINING the sticky
        # bit. This fixes protected_regular without making the cross-container state
        # replaceable by every UID in the Pod.
        - name: shared-state-ownership
          image: qmcgaw/gluetun@sha256:5fe20348352ca20d2d06d9a74b5f55c7eaecef924496c616aae41eba9c8dc718
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              chmod 1777 /shared
              chown 1000:1000 /shared
              actual=$(stat -c '%u:%g:%a' /shared)
              [ "$actual" = "1000:1000:1777" ] || {
                echo "shared-state-ownership: unexpected state $actual" >&2
                exit 1
              }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: shared, mountPath: /shared }
        # ---------------------------------------------------------------------------
        #  1. gluetun — NATIVE SIDECAR (restartPolicy: Always)
        # ---------------------------------------------------------------------------
        - name: gluetun
          # Digest-pinned. ⚠️ The docker gluetun runs mutable `:latest`; pinning is itself
          # an improvement. This exact digest is the one the test rig proved.
          image: qmcgaw/gluetun@sha256:5fe20348352ca20d2d06d9a74b5f55c7eaecef924496c616aae41eba9c8dc718
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities:
              drop: ["ALL"]
              # ⛔ MEASURED, NOT ASSUMED — three iterations to find, and an earlier draft
              # asserted NET_ADMIN alone, which CrashLoops:
              #   NET_ADMIN      tunnel + firewall
              #   CHOWN          else: chown /etc/openvpn/target.ovpn: operation not permitted
              #   DAC_OVERRIDE   else: auth.conf Permission denied — root cannot bypass
              #                  permission bits on the files gluetun just chowned
              #   SETUID/SETGID  OpenVPN runs as a dropped-privilege user
              #   NET_RAW        healthcheck can test ICMP instead of relying only on DNS
              add: ["NET_ADMIN", "NET_RAW", "CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
          env:
            - { name: VPN_SERVICE_PROVIDER, value: "private internet access" }
            - { name: VPN_TYPE, value: openvpn }
            # UDP/8080 repeatedly stopped receiving OpenVPN keepalives on every tested
            # Netherlands endpoint on 2026-08-11, taking both tunnels and their DNS down.
            # TCP/8443 retains PIA port forwarding and the pinned AS212238 server pool.
            - { name: OPENVPN_PROTOCOL, value: tcp }
            # binhex ran Denmark; the proven-working gluetun here runs Netherlands. Keep
            # them on the same provider but do not assume the region is interchangeable
            # for tracker geo rules.
            - { name: SERVER_REGIONS, value: Netherlands }
            # MAM sessions tolerate exit-IP changes only inside the session's ASN.
            # Region-only selection crossed AS212238 -> AS3257 -> AS174 during reconnects
            # on 2026-08-10, even though every gateway was in PIA's Netherlands region.
            # Split the full current Netherlands/AS212238 pool with deluge-vpn. The pools
            # must be disjoint: simultaneous recreation otherwise selected the same PIA
            # gateway for both and caused the connections to repeatedly displace each
            # other. Three groups here retain failover without crossing MAM's ASN boundary.
            - { name: SERVER_NAMES, value: "amsterdam441,amsterdam442,amsterdam445" }
            - { name: VPN_PORT_FORWARDING, value: "on" }
            # ⛔ CREDENTIALS FROM A SECRET VOLUME, never secretKeyRef. A resolved env
            # value reaches containerd's on-disk container metadata on the node, which
            # defeats the entire point of encrypting them in sops. gluetun reads files
            # natively. PROVEN on the test rig: the tunnel authenticated with nothing in
            # env and nothing on node disk.
            - { name: OPENVPN_USER_SECRETFILE, value: /run/secrets/openvpn-username }
            - { name: OPENVPN_PASSWORD_SECRETFILE, value: /run/secrets/openvpn-password }
            # ⛔ LOOPBACK ONLY. The control server can stop or reconfigure the VPN, and
            # omitting a Service does NOT protect it — Pods reach Pod IPs directly and
            # these namespaces have no default-deny.
            - { name: HTTP_CONTROL_SERVER_ADDRESS, value: "127.0.0.1:8000" }
            - { name: DNS_SERVER, value: "on" }
            - { name: DNS_UPSTREAM_IPV6, value: "off" }
            # ⛔ EMPTY, deliberately. Not the cluster CIDRs and not the LAN. These Pods
            # need NO cluster egress: image pulls happen on the node, probes/traefik/
            # prowlarr are inbound, replies are stateful, and app traffic belongs on tun0.
            # An earlier draft allowed 10.42/16 + 10.43/16, which was both unnecessary
            # (gluetun already accepts directly-attached subnets) and over-broad (a /16
            # reaches every Pod on every node).
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "" }
            - { name: PUBLICIP_FILE, value: /shared/ip }
            - { name: VPN_PORT_FORWARDING_STATUS_FILE, value: /shared/forwarded_port }
            - { name: LOG_LEVEL, value: info }
            - { name: TZ, value: America/Los_Angeles }
          # ⛔ A native sidecar alone does NOT guarantee ordering — Kubernetes proceeds
          # once a restartable init container is merely RUNNING unless it has a passing
          # startupProbe. Without this, "gluetun starts first" is not "the firewall is up".
          #
          # ⚠️ COMPOSITE on purpose: gluetun's healthcheck reports VPN health, NOT that its
          # DNS listener is ready. Health can pass while a first hostname lookup still gets
          # connection-refused, and the Deluge image performs an outbound geo lookup at
          # startup. So require BOTH the healthcheck and a live query to 127.0.0.1:53.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /gluetun-entrypoint healthcheck && nslookup -timeout=3 t.myanonamouse.net 127.0.0.1 >/dev/null
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["/gluetun-entrypoint", "healthcheck"] }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            # WHOLE DIRECTORY — ⛔ never subPath, which does not receive updates, so a
            # credential rotation would appear to succeed and change nothing.
            - { name: pia, mountPath: /run/secrets, readOnly: true }
            - { name: tun, mountPath: /dev/net/tun }
            - { name: shared, mountPath: /shared }
        # ---------------------------------------------------------------------------
        #  2. hardening — ONE-SHOT init, runs AFTER gluetun's startupProbe passes
        # ---------------------------------------------------------------------------
        # Closes the local-node / same-subnet relay path that NEITHER gluetun NOR a
        # NetworkPolicy can close:
        #   - gluetun independently ACCEPTs output to its directly attached subnet;
        #   - Kubernetes EXEMPTS Pod-to-local-node traffic from NetworkPolicy.
        # Without this, a malicious torrent or tracker URL pointing at a host-reachable
        # relay leaks the real IP with nothing compromised.
        #
        # ✅ MEASURED: `10.42.1.1:10250` reachable before, times out after, while the
        # tunnel keeps working. And the node's LAN address (10.0.1.6) was NOT reachable
        # even before — the exposure is the directly-attached /24 and its gateway only.
        #
        # ✅ ONE-SHOT IS SUFFICIENT, verified behaviourally across `kill 1` on gluetun:
        # gluetun APPENDS (-A) its rules while we INSERT (-I), so our DROP stays ABOVE its
        # local-subnet ACCEPT even after it rebuilds the firewall. A re-asserting sidecar
        # is NOT required. ⚠️ If a future gluetun flushes the chain instead, this becomes
        # a silent fail-open — re-verify this behaviour when bumping the digest.
        - name: hardening
          # Reuses the gluetun image purely because it already ships iptables; nothing
          # gluetun-specific is invoked.
          image: qmcgaw/gluetun@sha256:5fe20348352ca20d2d06d9a74b5f55c7eaecef924496c616aae41eba9c8dc718
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # ⛔ Derive the CONNECTED route for eth0 — the subnet this Pod is directly
              # attached to. An earlier version computed the address CIDR, never used it,
              # and then took the FIRST non-default eth0 route, which can be an endpoint
              # /32: the init would succeed while leaving the /24 relay path wide open.
              #
              # `proto kernel scope link` is exactly the connected-subnet route.
              net=$(ip -4 route show dev eth0 proto kernel scope link | awk '{print $1}')
              count=$(printf '%s\n' "$net" | grep -c '/' || true)
              # ⛔ Fail LOUDLY on zero or multiple. Zero would make `iptables -d ""` fail and
              # strand the Pod in init; multiple means the assumption is wrong and silently
              # containing only one of them is worse than not starting.
              if [ "$count" != "1" ]; then
                echo "hardening: expected exactly one connected eth0 subnet, got $count:" >&2
                printf '%s\n' "$net" >&2
                exit 1
              fi
              case "$net" in
                *.*.*.*/*) : ;;
                *) echo "hardening: implausible subnet '$net'" >&2; exit 1 ;;
              esac
              echo "hardening: containing relay path to $net"
              # ESTABLISHED first so INBOUND service traffic (traefik -> UI,
              # prowlarr -> daemon) and kubelet probe replies are unaffected; only NEW
              # outbound connections into the subnet are dropped.
              iptables -I OUTPUT 1 -d "$net" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              iptables -I OUTPUT 2 -d "$net" -j DROP
              iptables -S OUTPUT | head -4
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        # ---------------------------------------------------------------------------
        #  3. mam-registrar — NATIVE SIDECAR, ordered after gluetun
        # ---------------------------------------------------------------------------
        # ⛔ MUST be a restartable init container, not an ordinary sidecar. On an ordinary
        # sidecar a startupProbe gates only Pod readiness while Deluge starts CONCURRENTLY,
        # so the intended "Deluge cannot start before MAM is usable" gate would not exist.
        - name: mam-registrar
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "/scripts/register.sh"]
          # Succeeds only once an IP has actually been registered, so Deluge does not
          # start against a MAM session bound to a stale address.
          startupProbe:
            # ⛔ NOT `test -s`: a stale nonempty marker would satisfy that forever. This
            # requires the marker to match the CURRENT exit IP.
            exec: { command: ["/bin/sh", "/scripts/registered.sh"] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec: { command: ["/bin/sh", "/scripts/registered.sh"] }
            periodSeconds: 120
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            # ⛔ ONLY this container gets the MAM Secret.
            - { name: mam, mountPath: /run/secrets, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: shared, mountPath: /shared }
      containers:
        # ---------------------------------------------------------------------------
        #  deluge — no network capabilities whatsoever; it just uses the Pod netns
        # ---------------------------------------------------------------------------
        # ⛔ NAMED `deluge-books`, NOT `deluge`. monitoring.nix's workload watchlist is
        # runtime-agnostic — it matches an EXACT container name against `docker ps` OR
        # `k3s crictl`, which is how a migrated service stays monitored on a node with no
        # kubectl. An earlier version named this container `deluge`, so the watchlist entry
        # `deluge-books` would never have matched and this workload would have been
        # SILENTLY UNMONITORED after cutover. readmeabook, tracearr and plex all name their
        # container to match the service for exactly this reason.
        - name: deluge-books
          # binhex→binhex: the state tree was written by binhex's Deluge, so this changes
          # only the version and drops the VPN bundle. LinuxServer would change image
          # family AND version at once.
          #
          # ⛔ DEFAULT TAG TRACK. The `-libtorrentv1` variants are libtorrent 1.x and would
          # invalidate all 47 torrents' resume data.
          #
          # ✅ PROVEN 2026-08-08 on a throwaway copy, offline: Deluge 2.2.0 / libtorrent
          # 2.0.11 read 2.1.1 / 2.0.10 state with 47/47 infohashes, identical 41 seeding /
          # 6 downloading distribution, and NO rehash.
          image: binhex/arch-deluge@sha256:503ac5b44839bd2967ed4f4d9cf3349eda0d5fc2d7f51b360b49f0aaed3d1298
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities:
              drop: ["ALL"]
              # ⛔ MEASURED 2026-08-09 against this exact digest, config dir owned 1000:1000.
              # An earlier version of this file GUESSED CHOWN,SETUID,SETGID and would have
              # CrashLooped at cutover — the container exits 1:
              #   CHOWN                 init.sh chowns /config recursively
              #   FOWNER                else: chmod: changing permissions of '/config':
              #                         Operation not permitted (chmod needs FOWNER, NOT
              #                         DAC_OVERRIDE — adding DAC_OVERRIDE alone does not fix it)
              #   DAC_OVERRIDE          else: /config/perms.txt: Permission denied
              #   SETUID/SETGID         supervisord drops privileges to PUID/PGID
              # With all five: "Up (healthy)". With only the first four: exits 1.
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: UMASK, value: "000" }
            - { name: TZ, value: America/Los_Angeles }
          ports:
            - { name: http, containerPort: 8112 }
          # ⚠️ The binhex start-script performs an OUTBOUND geo lookup and blocks in a
          # bounded ~2 minute retry loop if it cannot resolve — MEASURED. Hence the
          # generous threshold, and hence gluetun's DNS gate above.
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
        # ---------------------------------------------------------------------------
        #  portsync — keeps Deluge's listen port equal to PIA's forwarded port
        # ---------------------------------------------------------------------------
        # ⛔ Added after cross-review: gluetun was writing /shared/forwarded_port and
        # NOTHING consumed it. The Pod would be Ready and serving its UI while announcing
        # a stale peer port after every allocation and every reconnect — inbound peers
        # simply never arrive, which presents as "slow torrents" rather than as a fault.
        #
        # ⚠️ A RETRYING WATCHER, not a one-shot hook: gluetun's port-forward hook can fire
        # before the daemon is listening, and that single update would then never be
        # retried until the next reconnect.
        #
        # An ordinary container (not an init container) so it starts alongside deluge; its
        # loop tolerates the daemon not being up yet.
        - name: portsync
          # Reuses the deluge image solely because it ships `deluge-console`.
          image: binhex/arch-deluge@sha256:503ac5b44839bd2967ed4f4d9cf3349eda0d5fc2d7f51b360b49f0aaed3d1298
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "/scripts/portsync.sh"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            # Read-only: it needs the daemon's auth file and nothing else.
            - { name: config, mountPath: /config, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: shared, mountPath: /shared }
      volumes:
        - name: pia
          secret: { secretName: pia-openvpn }
        - name: mam
          secret: { secretName: mam-session }
        - name: scripts
          configMap: { name: mam-registrar, defaultMode: 0555 }
        # Memory-backed: gluetun's public-IP and forwarded-port files never touch disk.
        - name: shared
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        # ⛔ `type: Directory` — the default CREATES a missing path, which here would mean
        # a fresh, empty Deluge presenting as a working one with zero torrents.
        #
        # ⚠️ A NEW directory, cold-copied from the stopped binhex tree at cutover. The
        # binhex tree at /usr/local/etc/deluge-books is NEVER opened by this Pod and
        # remains the rollback artifact — which is what makes upgrading Deluge in the same
        # move affordable.
        - name: config
          hostPath: { path: /usr/local/etc/deluge-books-k3s, type: Directory }
        - name: data
          hostPath: { path: /storage/Media/Torrents, type: Directory }
---
# ⛔ THERE IS DELIBERATELY NO NetworkPolicy HERE — neither ingress nor egress.
#
# INGRESS: this repo has MEASURED (manifests/namespaces.yaml) that Docker Traefik's source
# arrives as 10.42.1.1, and that neither `ipBlock: 10.42.1.1/32` nor `10.42.0.0/16` admits
# it — ipBlock matches only sources OUTSIDE the cluster network, while that address sits
# inside the Pod CIDR belonging to no Pod, so podSelector cannot match it either. Applying
# default-deny ingress in `books` took audiobookshelf offline with 502s.
#
# EGRESS: an earlier version of this file carried `egress: [{}]`, which is worse than
# nothing. It permits every flow, and because NetworkPolicies combine ADDITIVELY it would
# PREVENT any future policy from narrowing this Pod — a footgun disguised as a control.
# Narrowing egress properly requires pinning gluetun to an immutable PIA endpoint set and
# refreshing policy and gluetun together transactionally; until that exists, a rule that
# cannot go stale is safer than one that silently strands the tunnel.
#
# ✅ THE REAL BOUNDARY IS IN-NETNS AND IS TESTED: gluetun's own `-P OUTPUT DROP` with a
# dynamically-added /32 ACCEPT for the selected endpoint, plus the hardening container's
# DROP above gluetun's local-subnet ACCEPT. Both were verified behaviourally on a live rig,
# including across a gluetun restart. Do not add a NetworkPolicy here believing it adds
# defence in depth — on this cluster it does not, and an allow-all one actively blocks
# future tightening.
