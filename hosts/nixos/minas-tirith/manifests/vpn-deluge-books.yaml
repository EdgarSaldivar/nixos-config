# deluge-books — the first VPN-gated workload built as a DESIGN rather than a port.
#
# Replaces binhex/arch-delugevpn (privileged: true, CapEff 000001ffffffffff — every
# capability the kernel has, a bespoke init.sh kill-switch, credentials written to disk,
# and a MyAnonaMouse session cookie in argv) with a gluetun native sidecar and a plain
# Deluge container holding no network capabilities at all.
#
# Read K3S-VPN-STACK-DESIGN.md before changing anything here. Every value below that looks
# arbitrary was MEASURED on a live test rig on 2026-08-09, and the document records what
# broke without it.
#
# ⛔ STAGED AT replicas: 0. Nothing here is live. The Deployment is inert and there is
# deliberately NO Service in this file yet — adding a Service while docker still serves
# `deluge-books` would break prowlarr, and this repo has been bitten by exactly that.
# The Service, the traefik route and the EndpointSlice deletion all land in the CUTOVER
# commit, together, after docker stops.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mam-registrar
  namespace: media
data:
  # MAM sessions are IP-BOUND. gluetun's exit IP changes on every reconnect — MEASURED:
  # 212.56.48.64 -> 158.173.21.76 across a single restart. Without this, MAM access breaks
  # at the next reconnect, silently, long after cutover and looking unrelated.
  #
  # ⛔ Watches the PUBLIC IP FILE, not gluetun's port-forward hook. The hook fires on
  # "port forwarding established", which is a different event — registration would stop
  # silently if forwarding failed while egress stayed usable.
  #
  # ⛔ The cookie is read from the mounted Secret INSIDE this script and passed to curl
  # via a config file on stdin, never as an argv element. Putting it in argv is exactly
  # how it leaked into docker's Cmd and became visible to `docker inspect`.
  register.sh: |
    #!/bin/sh
    set -u
    IPFILE=/shared/ip
    MARKER=/shared/.mam-registered-ip
    COOKIE_FILE=/run/secrets/session-cookie
    backoff=5

    log() { echo "[mam-registrar] $*"; }

    register() {
      ip="$1"
      # --config - reads the cookie from stdin, so it never appears in argv or in `ps`.
      printf 'cookie = "mam_id=%s"\nurl = "https://t.myanonamouse.net/json/dynamicSeedbox.php"\nsilent\nfail\n' \
        "$(cat "$COOKIE_FILE")" | curl --config - >/dev/null 2>&1
    }

    while :; do
      # gluetun TRUNCATES this file to empty on disconnect and rewrites it
      # non-atomically. Ignore empty/partial reads or we submit garbage transitions.
      ip=$(cat "$IPFILE" 2>/dev/null | tr -d ' \n\r')
      case "$ip" in
        ''|*[!0-9.]*) sleep 5; continue ;;
      esac

      last=$(cat "$MARKER" 2>/dev/null || true)
      if [ "$ip" = "$last" ]; then
        backoff=5
        sleep 30
        continue
      fi

      if register "$ip"; then
        # The marker is the STARTUP GATE and it persists on a shared volume, so backoff
        # state survives a restart of this container. A finite failed startupProbe would
        # otherwise restart us, reset process-local backoff, and pound MAM during an
        # outage while Deluge never starts.
        echo "$ip" > "$MARKER"
        log "registered exit IP change"
        backoff=5
      else
        log "registration failed; retrying in ${backoff}s"
        sleep "$backoff"
        backoff=$(( backoff * 2 ))
        [ "$backoff" -gt 300 ] && backoff=300
      fi
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-books
  namespace: media
  labels:
    app: deluge-books
spec:
  # ⛔ ZERO. See the header. Raised only in the cutover commit, after docker stops and
  # after the state tree has been cold-copied.
  replicas: 0
  selector:
    matchLabels:
      app: deluge-books
  # Two Deluge processes on one state tree is how 47 torrents' queue, labels, ratios and
  # resume data are lost.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: deluge-books
    spec:
      # hostPaths are local to minas; without this the scheduler could place this on
      # pelargir and `type: Directory` would leave it Pending forever.
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # ⛔ THE APP MUST RESOLVE VIA GLUETUN, NEVER CoreDNS. Pods default to CoreDNS, and
      # CoreDNS has its own non-VPN egress — so a default-policy Pod leaks DNS (and DNS
      # tunnelling carries arbitrary data) whenever the tunnel is down. MEASURED working:
      # the app container's resolv.conf reads `nameserver 127.0.0.1` and resolution goes
      # over the tunnel.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
      initContainers:
        # ---------------------------------------------------------------------------
        #  1. gluetun — NATIVE SIDECAR (restartPolicy: Always)
        # ---------------------------------------------------------------------------
        - name: gluetun
          # Digest-pinned. ⚠️ The docker gluetun runs mutable `:latest`; pinning is itself
          # an improvement. This exact digest is the one the test rig proved.
          image: qmcgaw/gluetun@sha256:5fe20348352ca20d2d06d9a74b5f55c7eaecef924496c616aae41eba9c8dc718
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # ⛔ MEASURED, NOT ASSUMED — three iterations to find, and an earlier draft
              # asserted NET_ADMIN alone, which CrashLoops:
              #   NET_ADMIN      tunnel + firewall
              #   CHOWN          else: chown /etc/openvpn/target.ovpn: operation not permitted
              #   DAC_OVERRIDE   else: auth.conf Permission denied — root cannot bypass
              #                  permission bits on the files gluetun just chowned
              #   SETUID/SETGID  OpenVPN runs as a dropped-privilege user
              add: ["NET_ADMIN", "CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
          env:
            - { name: VPN_SERVICE_PROVIDER, value: "private internet access" }
            - { name: VPN_TYPE, value: openvpn }
            - { name: OPENVPN_PROTOCOL, value: udp }
            # binhex ran Denmark; the proven-working gluetun here runs Netherlands. Keep
            # them on the same provider but do not assume the region is interchangeable
            # for tracker geo rules.
            - { name: SERVER_REGIONS, value: Netherlands }
            - { name: VPN_PORT_FORWARDING, value: "on" }
            # ⛔ CREDENTIALS FROM A SECRET VOLUME, never secretKeyRef. A resolved env
            # value reaches containerd's on-disk container metadata on the node, which
            # defeats the entire point of encrypting them in sops. gluetun reads files
            # natively. PROVEN on the test rig: the tunnel authenticated with nothing in
            # env and nothing on node disk.
            - { name: OPENVPN_USER_SECRETFILE, value: /run/secrets/openvpn-username }
            - { name: OPENVPN_PASSWORD_SECRETFILE, value: /run/secrets/openvpn-password }
            # ⛔ LOOPBACK ONLY. The control server can stop or reconfigure the VPN, and
            # omitting a Service does NOT protect it — Pods reach Pod IPs directly and
            # these namespaces have no default-deny.
            - { name: HTTP_CONTROL_SERVER_ADDRESS, value: "127.0.0.1:8000" }
            - { name: DNS_SERVER, value: "on" }
            - { name: DNS_UPSTREAM_IPV6, value: "off" }
            # ⛔ EMPTY, deliberately. Not the cluster CIDRs and not the LAN. These Pods
            # need NO cluster egress: image pulls happen on the node, probes/traefik/
            # prowlarr are inbound, replies are stateful, and app traffic belongs on tun0.
            # An earlier draft allowed 10.42/16 + 10.43/16, which was both unnecessary
            # (gluetun already accepts directly-attached subnets) and over-broad (a /16
            # reaches every Pod on every node).
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "" }
            - { name: PUBLICIP_FILE, value: /shared/ip }
            - { name: VPN_PORT_FORWARDING_STATUS_FILE, value: /shared/forwarded_port }
            - { name: LOG_LEVEL, value: info }
            - { name: TZ, value: America/Los_Angeles }
          # ⛔ A native sidecar alone does NOT guarantee ordering — Kubernetes proceeds
          # once a restartable init container is merely RUNNING unless it has a passing
          # startupProbe. Without this, "gluetun starts first" is not "the firewall is up".
          #
          # ⚠️ COMPOSITE on purpose: gluetun's healthcheck reports VPN health, NOT that its
          # DNS listener is ready. Health can pass while a first hostname lookup still gets
          # connection-refused, and the Deluge image performs an outbound geo lookup at
          # startup. So require BOTH the healthcheck and a live query to 127.0.0.1:53.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /gluetun-entrypoint healthcheck && nslookup -timeout=3 t.myanonamouse.net 127.0.0.1 >/dev/null
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["/gluetun-entrypoint", "healthcheck"] }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            # WHOLE DIRECTORY — ⛔ never subPath, which does not receive updates, so a
            # credential rotation would appear to succeed and change nothing.
            - { name: pia, mountPath: /run/secrets, readOnly: true }
            - { name: tun, mountPath: /dev/net/tun }
            - { name: shared, mountPath: /shared }
        # ---------------------------------------------------------------------------
        #  2. hardening — ONE-SHOT init, runs AFTER gluetun's startupProbe passes
        # ---------------------------------------------------------------------------
        # Closes the local-node / same-subnet relay path that NEITHER gluetun NOR a
        # NetworkPolicy can close:
        #   - gluetun independently ACCEPTs output to its directly attached subnet;
        #   - Kubernetes EXEMPTS Pod-to-local-node traffic from NetworkPolicy.
        # Without this, a malicious torrent or tracker URL pointing at a host-reachable
        # relay leaks the real IP with nothing compromised.
        #
        # ✅ MEASURED: `10.42.1.1:10250` reachable before, times out after, while the
        # tunnel keeps working. And the node's LAN address (10.0.1.6) was NOT reachable
        # even before — the exposure is the directly-attached /24 and its gateway only.
        #
        # ✅ ONE-SHOT IS SUFFICIENT, verified behaviourally across `kill 1` on gluetun:
        # gluetun APPENDS (-A) its rules while we INSERT (-I), so our DROP stays ABOVE its
        # local-subnet ACCEPT even after it rebuilds the firewall. A re-asserting sidecar
        # is NOT required. ⚠️ If a future gluetun flushes the chain instead, this becomes
        # a silent fail-open — re-verify this behaviour when bumping the digest.
        - name: hardening
          # Reuses the gluetun image purely because it already ships iptables; nothing
          # gluetun-specific is invoked.
          image: qmcgaw/gluetun@sha256:5fe20348352ca20d2d06d9a74b5f55c7eaecef924496c616aae41eba9c8dc718
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Derive the Pod's own subnet at runtime — no hardcoded CIDR, so this keeps
              # working if the node's pod subnet changes.
              cidr=$(ip -4 -o addr show dev eth0 | awk '{print $4}')
              net=$(ip -4 route | awk -v d="$cidr" '$1 !~ /default/ && $0 ~ /eth0/ {print $1; exit}')
              echo "hardening: containing relay path to $net"
              # ESTABLISHED first so INBOUND service traffic (traefik -> UI,
              # prowlarr -> daemon) and kubelet probe replies are unaffected; only NEW
              # outbound connections into the subnet are dropped.
              iptables -I OUTPUT 1 -d "$net" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              iptables -I OUTPUT 2 -d "$net" -j DROP
              iptables -S OUTPUT | head -4
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        # ---------------------------------------------------------------------------
        #  3. mam-registrar — NATIVE SIDECAR, ordered after gluetun
        # ---------------------------------------------------------------------------
        # ⛔ MUST be a restartable init container, not an ordinary sidecar. On an ordinary
        # sidecar a startupProbe gates only Pod readiness while Deluge starts CONCURRENTLY,
        # so the intended "Deluge cannot start before MAM is usable" gate would not exist.
        - name: mam-registrar
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "/scripts/register.sh"]
          # Succeeds only once an IP has actually been registered, so Deluge does not
          # start against a MAM session bound to a stale address.
          startupProbe:
            exec: { command: ["/bin/sh", "-c", "test -s /shared/.mam-registered-ip"] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            # ⛔ ONLY this container gets the MAM Secret.
            - { name: mam, mountPath: /run/secrets, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: shared, mountPath: /shared }
      containers:
        # ---------------------------------------------------------------------------
        #  deluge — no network capabilities whatsoever; it just uses the Pod netns
        # ---------------------------------------------------------------------------
        - name: deluge
          # binhex→binhex: the state tree was written by binhex's Deluge, so this changes
          # only the version and drops the VPN bundle. LinuxServer would change image
          # family AND version at once.
          #
          # ⛔ DEFAULT TAG TRACK. The `-libtorrentv1` variants are libtorrent 1.x and would
          # invalidate all 47 torrents' resume data.
          #
          # ✅ PROVEN 2026-08-08 on a throwaway copy, offline: Deluge 2.2.0 / libtorrent
          # 2.0.11 read 2.1.1 / 2.0.10 state with 47/47 infohashes, identical 41 seeding /
          # 6 downloading distribution, and NO rehash.
          image: binhex/arch-deluge@sha256:503ac5b44839bd2967ed4f4d9cf3349eda0d5fc2d7f51b360b49f0aaed3d1298
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # binhex images chown /config and drop privileges to PUID/PGID at startup.
              # ⚠️ Narrow this against the real image before cutover the same way gluetun's
              # set was narrowed — do not assume these three are all required.
              add: ["CHOWN", "SETUID", "SETGID"]
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: UMASK, value: "000" }
            - { name: TZ, value: America/Los_Angeles }
          ports:
            - { name: http, containerPort: 8112 }
          # ⚠️ The binhex start-script performs an OUTBOUND geo lookup and blocks in a
          # bounded ~2 minute retry loop if it cannot resolve — MEASURED. Hence the
          # generous threshold, and hence gluetun's DNS gate above.
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
      volumes:
        - name: pia
          secret: { secretName: pia-openvpn }
        - name: mam
          secret: { secretName: mam-session }
        - name: scripts
          configMap: { name: mam-registrar, defaultMode: 0555 }
        # Memory-backed: gluetun's public-IP and forwarded-port files never touch disk.
        - name: shared
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        # ⛔ `type: Directory` — the default CREATES a missing path, which here would mean
        # a fresh, empty Deluge presenting as a working one with zero torrents.
        #
        # ⚠️ A NEW directory, cold-copied from the stopped binhex tree at cutover. The
        # binhex tree at /usr/local/etc/deluge-books is NEVER opened by this Pod and
        # remains the rollback artifact — which is what makes upgrading Deluge in the same
        # move affordable.
        - name: config
          hostPath: { path: /usr/local/etc/deluge-books-k3s, type: Directory }
        - name: data
          hostPath: { path: /storage/Media/Torrents, type: Directory }
---
# Egress policy. ⛔ There is deliberately NO INGRESS POLICY: this repo has already MEASURED
# (see manifests/namespaces.yaml) that Docker Traefik's source arrives as 10.42.1.1 and that
# neither `ipBlock: 10.42.1.1/32` nor `10.42.0.0/16` admits it — ipBlock matches only
# sources OUTSIDE the cluster network, while that address sits inside the Pod CIDR belonging
# to no Pod, so podSelector cannot match it either. Applying default-deny ingress in `books`
# took audiobookshelf offline with 502s. Revisit when traefik itself moves in Phase 6.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deluge-books-egress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: deluge-books
  policyTypes: ["Egress"]
  egress:
    # ⛔ NOT a bare default-deny. This policy applies to the WHOLE Pod including gluetun's
    # own OpenVPN connection, and it cannot match a process or tun0. A default-deny here
    # means gluetun can never reach PIA, its startupProbe never passes, and the Pod sits in
    # init FOREVER.
    #
    # ⚠️ Deliberately permissive on egress: gluetun's own OUTPUT policy is DROP with a
    # dynamically-added /32 ACCEPT for exactly the endpoint it selected, so the in-netns
    # firewall — not this policy — is the real egress discriminator. Narrowing this to
    # specific PIA /32s would require pinning gluetun to an immutable endpoint set and
    # refreshing both together transactionally; until that is designed, a rule that cannot
    # go stale is safer than one that silently strands the tunnel.
    - {}
