# plex — the primary media server and one half of the GPU pair. This manifest owns
# both its one-replica Deployment and its Service.
#
# ⛔ `hostPort` IS NOT A FENCE. CNI implements hostPort as PREROUTING DNAT, not a
# bound socket, so another runtime can overlap this Pod on 32400. Such an overlap
# would put two writers on the same library database while competing NAT rules
# decide traffic. `strategy: Recreate` prevents overlapping revisions of this
# Deployment, but it cannot interlock with another runtime.
#
# Service ownership matters when staging a replacement. A zero-replica Deployment
# is inert, but replacing a selectorless bridge with a selector-backed Service at
# zero replicas black-holes the name. Keep the existing Service owner untouched
# until its backing workload is ready for the same declarative transition; never
# split one Service across two AddOns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  labels:
    app: plex
spec:
  # Durable desired state belongs in git. Change this value in a commit, never only
  # with `kubectl scale`, so k3s reconciliation cannot silently restore a stale
  # replica count (docs/architecture/k3s.md, "Durable state belongs in git").
  replicas: 1
  selector:
    matchLabels:
      app: plex
  # A rolling update would put two writers on the same hostPath SQLite database, and
  # would also collide on hostPort 32400.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: plex
    spec:
      # 333 GB of config plus the media trees are all local to minas.
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      # The CDI shim from k3s-gpu.nix. Without it there is no /dev/nvidia* and hardware
      # transcoding falls back to CPU SILENTLY — it does not error, it just gets slow.
      runtimeClassName: nvidia
      # Plex writes its databases on shutdown; give it room to finish rather than being
      # SIGKILLed mid-write. Its library.db is WAL, so a hard kill is recoverable, but
      # there is no reason to rely on that.
      terminationGracePeriodSeconds: 120
      containers:
        # Name must stay exactly `plex`: monitoring.nix's critical-workload watchlist
        # matches CONTAINER names in both runtimes (`crictl ps` -> "name": "plex").
        - name: plex
          # Digest-pinned, which for plex is a REAL change rather than a formality:
          # compose says `linuxserver/plex:latest`, a mutable tag that would silently
          # upgrade the primary media server on any node restart or re-pull. This digest
          # was verified to be exactly what was running — same config ID as docker's
          # image and the same `1.43.3.10861-07dfddaeb-ls318` version label — so pinning
          # freezes today's version rather than adopting a new one.
          image: docker.io/linuxserver/plex@sha256:d8b3417b9173bab8bb79b167119b6b69a85558f2127e7fa810a045654e3dbe7f
          imagePullPolicy: IfNotPresent
          # ⛔ NO runAsUser. linuxserver images start as root and drop to PUID/PGID via
          # s6 themselves. Verified live: `docker exec plex id` -> uid=0, while the
          # config tree is 1000:1000 because compose sets PUID/PGID 1000.
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: VERSION, value: docker }
            # ⛔ DOCKER_MODS IS DELIBERATELY DROPPED, and this is the one env var from
            # compose that is NOT translated. Do not "restore" it.
            #
            # Compose sets `DOCKER_MODS=linuxserver/mods=plex-absolute-hama`, which
            # installs the legacy HAMA anime agent on every container boot. It was
            # dropped 2026-08-08 after checking whether anything actually uses it —
            # nothing does:
            #
            #   Movies    tv.plex.agents.movie    (Plex Movie)
            #   TV Shows  tv.plex.agents.series   (Plex TV Series)
            #   Anime     tv.plex.agents.series   (Plex TV Series)   <- not HAMA
            #   metadata_items bound to a hama guid: 0
            #
            # The Anime library moved to the modern series agent long ago, so the mod
            # was installing an agent with no consumer. `Hama.bundle` is still present
            # in the config tree and is left alone — it is inert, and deleting library
            # data to tidy up is not worth the risk.
            #
            # Dropping it removes three real costs: an `(ERROR) OFFLINE: ... not found
            # in modcache` on EVERY pod start, an internet dependency during startup
            # (mods are tarballs fetched fresh each boot, so they were never covered by
            # the image digest above), and a mod that could silently change what runs
            # here without any config change.
            # ⚠️ NVIDIA_VISIBLE_DEVICES is deliberately OMITTED although compose sets it
            # to `all`. The device plugin runs DEVICE_LIST_STRATEGY=envvar and its
            # allocation response SETS this variable to the device it allocated;
            # restating `all` would override the plugin and defeat the accounting.
            # Same deviation, and same reason, as jellyfin.
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: all }
            # ⚠️ NOT from compose — added 2026-08-08, and it FIXED HARDWARE TRANSCODING.
            # Do not remove it without re-testing a real transcode.
            #
            # Plex's transcoder logged `Cannot load libcuda.so.1` on EVERY transcode and
            # silently fell back to CPU. That predates the migration (the rotated
            # docker-era log has the same errors five hours before docker was stopped),
            # so this fixed a long-standing defect rather than repairing a regression.
            #
            # VERIFIED on a real client playback afterwards: zero `Cannot load libcuda`
            # in the log, `videoDecision="transcode"` on an HEVC source, and
            # `transcodeHwDecoding="nvdec"` with `transcodeHwEncoding="nvenc"` in
            # Plex Transcoder Statistics — written at 01:53:21, matching the session end
            # in the server log to the second.
            #
            # Everything the loader needs was already correct and was checked: all four
            # NVIDIA libs are in the ldconfig cache, readable by uid 1000, with linker
            # config byte-identical to jellyfin — whose ffmpeg loads CUDA fine on this
            # node as its own uid. The one oddity is that on NixOS the cache resolves
            # `libcuda.so.1` indirectly to a `/nix/store/...` path, while
            # /usr/local/nvidia/lib holds the same libraries behind direct relative
            # symlinks. Pointing the loader at that directory first bypasses the
            # indirection without touching the node's CDI setup.
            - { name: LD_LIBRARY_PATH, value: /usr/local/nvidia/lib }
          ports:
            # hostPort because compose publishes it and clients — including Plex's own
            # remote-access probing — reach this port directly.
            #
            # ⛔ hostPort IS NOT AN INTERLOCK against another runtime. CNI implements
            # it as PREROUTING DNAT rather than a bound socket, so two processes can
            # both "have" 32400 and both open the databases. Prove any old writer is
            # stopped before enabling a replacement. (`ss` also shows nothing for a
            # hostPort — test from another machine.)
            - { name: http, containerPort: 32400, hostPort: 32400 }
          resources:
            # D7: cpu, memory AND ephemeral-storage requests. Memory from the ledger's
            # measured 353 M working set (docker stats' 2060 M is mostly page cache and
            # overstates by ~6x), rounded up because this is the primary server.
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              # The second time-sliced share. The plugin advertises 2 for exactly these
              # two consumers; with jellyfin holding one, this completes the pair and
              # makes GPU use accounted for the first time.
              nvidia.com/gpu: 1
              # An EMERGENCY CEILING, not a tuned limit — the distinction matters.
              #
              # Transcode scratch goes to /dev/shm and IS charged to this cgroup
              # (measured on jellyfin: writing 2 GiB moved `shmem` by exactly
              # 2147487744), and the node has NO SWAP, so shmem cannot be reclaimed and
              # reaching a limit is an OOM kill rather than a slowdown. jellyfin's
              # measured rate was ~57 MiB per minute of output at 8 Mbps.
              #
              # No PLEX transcode has been measured yet, and plex is the primary server,
              # so a tuned number would be a guess whose failure mode is OOM-killing a
              # real user's stream partway. But cross-review was right that infinity is
              # not the only alternative: unbounded, plex can fill the shared 63 GiB
              # tmpfs and drive the NODE's OOM killer, which may then pick nextcloud or
              # a database instead of plex.
              #
              # 24Gi is derived from node headroom rather than from plex: ~19% of the
              # 125 GB node, far above any plausible session (at jellyfin's rate it is
              # over seven hours of 8 Mbps output) yet low enough that a runaway is
              # contained here. Replace it with a measured value once a real plex
              # transcode has been profiled, exactly as was done for jellyfin.
              memory: 24Gi
          # /identity verified live (200, no auth). `/` returns 401, so a guessed
          # readiness path would leave the Pod permanently NotReady — the same trap
          # sonarr and animearr set.
          startupProbe:
            httpGet: { path: /identity, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            # Generous: plex opens a 497 MB library database and a 1.26 GB blobs
            # database on start, and DOCKER_MODS fetches from the internet first.
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /identity, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /identity, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: config, mountPath: /config }
            # NOTE the path is /transcode, NOT /data/transcode as jellyfin uses. Both
            # bind the host's /dev/shm; only the in-container path differs, and the
            # compose comment records the intent: keep transcode artifacts out of the
            # config tree so backups do not copy them.
            - { name: transcode, mountPath: /transcode }
            - { name: movies, mountPath: /data/Movies, readOnly: true }
            - { name: television, mountPath: /data/Television, readOnly: true }
            - { name: anime, mountPath: /data/Anime, readOnly: true }
      volumes:
        # `type: Directory` — the default type CREATES a missing path, which here would
        # mean plex starting against an EMPTY config and re-registering itself as a new
        # server rather than failing loudly. 333 GB of metadata is at stake.
        - name: config
          hostPath: { path: /home/edgar/docker-services/plex/config, type: Directory }
        - name: transcode
          hostPath: { path: /dev/shm, type: Directory }
        - name: movies
          hostPath: { path: /storage/Media/Movies, type: Directory }
        - name: television
          hostPath: { path: /storage/Media/Television, type: Directory }
        - name: anime
          hostPath: { path: /storage/Media/Anime, type: Directory }
---
# The real Service, replacing the selectorless bridge of the same name. Consumers —
# tautulli, overseerr, maintainerr, wrapperr and the *arr mesh — hold `plex` or
# `http://plex:32400` in their application databases, so the NAME is the contract.
#
# ⛔ `clusterIP` IS PINNED, and it is not cosmetic. The bridge Service is owned by the
# `minas-docker-bridges` AddOn, and `minas-docker-bridges.yaml` sorts BEFORE
# `minas-plex.yaml` in the auto-deploy directory (verified with `sort`, after an earlier
# comment claimed the opposite). So on the deploy that removes the bridge entry, that
# AddOn PRUNES this Service first and this file's AddOn then creates it fresh — a
# delete-and-recreate across two owners, not an in-place patch. Without this line the
# recreated Service would get a NEW ClusterIP, and anything holding the old address
# would fail until it re-resolved; CoreDNS alone caches for 30 s.
#
# 10.43.57.77 is the address the bridge already had, so the takeover is invisible.
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: media
  labels:
    app: plex
spec:
  clusterIP: 10.43.57.77
  selector:
    app: plex
  ports:
    - { name: http, port: 32400, targetPort: http }
