# traefik — the minas edge. LIVE since 2026-08-10T06:24:31Z; this replaced the docker
# container that had served all 26 public hostnames.
#
# ⚠️ This file previously described itself as "staged, inert at replicas: 0". It is no
# longer inert — see the phase C block on `replicas` below before changing anything here.
# ⛔ A change to `spec.template` in this file triggers a Deployment rollout, and with
# `strategy: Recreate` on a pinned singleton that is a FULL INGRESS OUTAGE, not a rolling
# update. Treat every template edit as a scheduled maintenance window.
#
# ⛔ THIS CUTOVER IS ATOMIC. traefik is the router, so there is no lower-priority
# route to stage behind the docker instance: from the moment docker stops until
# this Pod is serving, all 26 hostnames are down.
#
# ⛔ THE TWO RUNTIMES MUST NEVER OVERLAP, AND `strategy: Recreate` DOES NOT ENSURE IT.
# Recreate only orders Pods of THIS Deployment. `hostPort` is a CNI PREROUTING DNAT
# rule, not a bound socket, so it is not an interlock against docker either — this
# repository already documents that hostPort is not a fence in either direction.
# Two traefiks can therefore be live at once, with traffic following competing docker
# and CNI rules, and — far worse — BOTH writing the same `/etc/letsencrypt/acme.json`.
# Concurrent ACME writers can corrupt the certificate store for all 26 hostnames.
#
#   CUTOVER:  stop docker traefik  ->  PROVE it is gone  ->  scale this to 1
#   ROLLBACK: scale this to 0  ->  PROVE the Pod is gone ->  docker start traefik
#
# ⚠️ Rollback is therefore NOT a one-command `docker start traefik`. Allow up to the
# 30s entrypoint drain plus termination before docker may safely be started.
#
# ⛔ READINESS IS NOT A CUTOVER GATE HERE. Traffic arrives on hostPort, not through a
# Service, so readiness withdraws nothing and gates nothing — it is process telemetry.
# /ping proves the process answers; it does NOT prove the file provider loaded, that a
# usable certificate exists, or that any backend resolves. A malformed route file or
# unusable ACME state yields a Ready Pod serving 404s or a default certificate on every
# hostname. Accept the cutover on EXTERNAL checks: real HTTPS status codes per hostname
# against the recorded baseline, certificate issuer/identity, and dashboard auth.
#
# ✅ MEASURED: k3s's bundled traefik and its ServiceLB run only on pelargir. The
# ServiceLB DaemonSet selects `svccontroller.k3s.cattle.io/enablelb=true`, and only
# pelargir has that label; minas does not and has no taints. Therefore hostPort 80
# and 443 are currently uncontested on minas.
#
# ⛔ STANDING CONSTRAINT: never add
# `svccontroller.k3s.cattle.io/enablelb=true` to minas. That one label would let
# k3s ServiceLB schedule here and fight this Pod for the two ports serving all 26
# hostnames. Do not remove or merge the separate k3s-owned traefik on pelargir.
#
# ⚠️ This Pod deliberately triggers the namespace's PodSecurity baseline warnings —
# plural. BOTH the host ports AND the two hostPath volumes are outside baseline, so
# expect more than one warning and do not misdiagnose them as a new problem. The
# namespace warns/audits and does not enforce, exactly as for calibre's seccomp field.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
spec:
  # PHASE C — durable promotion, 2026-08-10. The cutover itself ran with this at 0 and
  # scaled imperatively, deliberately: while the declaration said 0, a rollback was a
  # single authoritative action (scale to 0) that activation could not undo.
  #
  # ⛔ Leaving it at 0 after acceptance is NOT the safe state, it is the dangerous one.
  # k3s auto-deploy re-applies a manifest when its file checksum changes OR when the
  # server restarts, so a declared 0 would reassert itself and take ALL 26 hostnames
  # down, with nothing in git to explain why. This one's blast radius is the entire
  # public ingress.
  #
  # The fleet-wide replica drift this used to warn about is CLOSED: no manifest
  # declares 0 while running at 1. Do not go hunting for the "15 other services" an
  # earlier version of this comment named.
  #
  # ⚠️ osgiliath's four workloads DO declare 0, and that is correct rather than
  # drift -- the host is not deployed, so a 1 there produces a permanently Pending
  # Pod. They are raised in a commit when the host joins.
  #
  # ⛔ Promoting is only half the phase — VERIFY BOTH SIDES, or the drift just moves
  # somewhere less visible:
  #   sudo grep -E '^  replicas:' /var/lib/rancher/k3s/server/manifests/minas-traefik.yaml
  #   sudo k3s kubectl -n traefik get deploy traefik -o jsonpath='{.spec.replicas}'
  # Both must read 1.
  #
  # ⛔ If this cutover is ever rolled back, revert this commit too — a `replicas: 1`
  # sitting in git is a scheduled outage waiting for the next deploy.
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  # ⛔ Two instances cannot bind the same host ports, and acme.json is a
  # single-writer file that concurrent renewal can corrupt.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: traefik
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      # ⚠️ This is the OUTER bound only, and it is deliberately longer than traefik's
      # own 30s entrypoint drain set in args below. Kubernetes waits at most this long
      # before SIGKILL; traefik decides when it actually stops serving. Sizing this
      # BELOW the entrypoint graceTimeOut would SIGKILL mid-drain and defeat it.
      # It is a ceiling, not a wait — a clean exit is immediate.
      terminationGracePeriodSeconds: 60
      containers:
        - name: traefik
          image: traefik@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
          imagePullPolicy: IfNotPresent
          # ⛔ The Docker provider and Docker daemon socket mount are deliberately
          # absent. After cutover there are no containers for it to discover, and
          # granting a Pod the daemon socket is a full node-takeover primitive.
          # ⚠️ Precisely: dropping it does not remove *literally nothing*. With
          # `traefik.enable=true` and no rule label, the docker provider still
          # synthesises a router from its `defaultRule` (Host(`traefik`)). None of the
          # 26 public hostnames came from it — they are all file-provider routes — but
          # before cutover, confirm nothing internal consumes that implicit name.
          # ⛔ Do not restore the socket to keep unused discovery.
          args:
            - --log=true
            - --accesslog=true
            # ⛔ MEASURED on the canary 2026-08-09: without this flag the access log is
            # Common Log Format, NOT JSON. `traefik.yml` in the dynamic directory does say
            # `accessLog: format: json`, but accessLog is a STATIC key sitting in a DYNAMIC
            # config file, so traefik silently ignores it — the exact trap
            # docs/architecture/ingress.md warns about. CLF carries the router name but NOT the
            # request host, so host->router correlation is impossible from it, and that
            # correlation is the review's required evidence that no route silently changed
            # provider at cutover. Set it here, where static keys are actually read.
            - --accesslog.format=json
            - --providers.file.directory=/etc/traefiks
            - --entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
            - --entryPoints.traefik.address=:8080
            - --api=true
            - --api.dashboard=true
            - --api.insecure=false
            - --certificatesResolvers.dns-cloudflare.acme.email=teremaire@gmail.com
            - --certificatesResolvers.dns-cloudflare.acme.storage=/etc/letsencrypt/acme.json
            - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
            - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.delayBeforeCheck=90
            - --entrypoints.http.address=:80
            - --entrypoints.https.address=:443
            - --entrypoints.http.http.redirections.entrypoint.to=https
            - --entrypoints.http.http.redirections.entrypoint.scheme=https
            - --entrypoints.https.http.tls=true
            - --entrypoints.https.http.tls.certResolver=dns-cloudflare
            - --entrypoints.https.http.tls.domains[0].main=saldivar.io
            - --entrypoints.https.http.tls.domains[0].sans=*.saldivar.io
            - --serversTransport.insecureSkipVerify=true
            - --ping=true
            # ⛔ traefik's OWN drain timeout, which is NOT terminationGracePeriodSeconds.
            # It defaults to 10s, so a 60s Kubernetes grace period does not give a long
            # upload or stream 60s to finish — traefik stops accepting and exits first.
            # Set explicitly on BOTH entrypoints so the two numbers are related on purpose.
            # ⚠️ This lengthens rollback: scaling to zero now takes up to 30s before the
            # Pod is gone and docker can safely be started. That is the intended trade.
            - --entryPoints.http.transport.lifeCycle.graceTimeOut=30s
            - --entryPoints.https.transport.lifeCycle.graceTimeOut=30s
          # ✅ MEASURED on the live docker container: anon memory **22 MiB**, idle CPU 0.00%.
          # ⚠️ `memory.current` reads 107 MiB and `docker stats` 92 MiB — both dominated by
          # page cache, which this fleet already documents as overstating by up to 6x. The
          # anon figure is the one to size against.
          # ⛔ Requests exist so this Pod is NOT BestEffort. As the sole public ingress it
          # must not be first in line for eviction under node pressure, and CPU starvation
          # would make /ping miss its timeout and trigger the liveness restart below —
          # turning pressure into a full ingress outage.
          # ⛔ Deliberately NO memory limit: an OOMKill here takes down all 26 hostnames,
          # and a guessed ceiling is worse than none. Requests give Burstable QoS, which is
          # the protection that matters.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
          ports:
            # hostPort is the narrow grant needed for ingress; hostNetwork would
            # expose the node's entire network namespace to this Pod.
            - { name: http, containerPort: 80, hostPort: 80 }
            - { name: https, containerPort: 443, hostPort: 443 }
            # ⛔ Probe/API port only. It must never have a hostPort or LAN exposure.
            - { name: traefik, containerPort: 8080 }
          env:
            - name: CLOUDFLARE_DNS_API_TOKEN
              valueFrom:
                secretKeyRef: { name: traefik-env, key: cloudflare-dns-api-token }
            # ⚠️ The email is not itself sensitive, but it stays with the token.
            - name: CLOUDFLARE_EMAIL
              valueFrom:
                secretKeyRef: { name: traefik-env, key: cloudflare-email }
          # ✅ MEASURED: /ping returns 200 with body OK for 127.0.0.1, the
          # container IP, and traefik.saldivar.io, so no Host header override is
          # needed. This was checked because kubelet sends the Pod IP as Host:
          # nextcloud answers 400 to that, failed startup 17 times, and a failing
          # startupProbe suppresses readiness and liveness entirely.
          startupProbe:
            httpGet: { path: /ping, port: traefik }
            periodSeconds: 5
            timeoutSeconds: 5
            # First start may include the 90-second ACME check.
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: traefik }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # ⚠️ A livenessProbe on the ONLY ingress is a deliberate trade, not an
          # oversight — restarting this Pod drops every in-flight connection for all
          # 26 hostnames and must re-bind 80/443. It earns its place because a hung
          # traefik is otherwise unrecoverable without a human. /ping is served
          # in-process and does not touch a backend, so it does not fail merely
          # because a route or an upstream is down.
          # ⛔ THE ARITHMETIC, corrected: `failureThreshold` counts failures, not
          # intervals. N failures at a 30s period span N-1 intervals, so the previous
          # 3 gave ~60s from first failure to restart, not the 90s the comment claimed.
          # 4 failures is what actually yields ~90s. Do not shorten it: a liveness
          # probe that fires under load is an outage generator on a singleton ingress.
          livenessProbe:
            httpGet: { path: /ping, port: traefik }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          # ⛔ No runAsUser and no fsGroup. ✅ MEASURED: traefik 3.7.10 runs as
          # root today; it must bind 80/443 and read root:root mode-0600 acme.json.
          volumeMounts:
            # ⛔ This exact path is written by minas activation on another host.
            # Moving it would silently leave traefik with zero generated routes.
            - { name: file-provider, mountPath: /etc/traefiks, readOnly: true }
            - { name: letsencrypt, mountPath: /etc/letsencrypt }
      volumes:
        # minas activation owns these 25 generated k8s route files; traefik reads.
        #
        # Relocated 2026-08-16 off /home/edgar/git/docker, the dead pre-migration
        # Docker checkout. ⛔ This path and `routeDir` in traefik-routes.nix are two
        # halves of ONE value -- the producer is minas activation, the consumer is
        # this Pod, and they must always name the same directory. Changing one alone
        # gives a traefik with no generated routes.
        - name: file-provider
          hostPath:
            path: /usr/local/etc/traefik
            type: Directory
        # Read-write for the existing wildcard certificate store and renewals.
        - name: letsencrypt
          hostPath:
            path: /etc/letsencrypt
            type: Directory
