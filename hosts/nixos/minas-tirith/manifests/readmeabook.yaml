# readmeabook — the FIRST genuine database migration on this fleet.
#
# One container running Postgres 16 + Redis + the app under supervisord, so this is not a
# manifest translation: it moves a live 179 MB PGDATA off a docker NAMED VOLUME.
# Per the ledger the settled approach is a COLD FILE COPY of stopped volumes, migrating
# as-is rather than decomposing it into separate Pods — the image's own supervisord
# expects all three processes together, and splitting it would be a rewrite, not a move.
#
# ⛔ IT HAS THREE BARE-NAME EDGES, and docs/architecture/k3s.md said it had none. Its live
# `configuration` table holds:
#     audiobookshelf.server_url   http://audiobookshelf:80   k3s, books  (native here)
#     prowlarr_url                http://prowlarr:9696       k3s, media  (ExternalName below)
#     download_clients[0].url     http://gluetun:8080        docker      (bridge below)
# Those are CONFIG, not history — they live in `configuration`, whereas the prowlarr
# download URLs that also appear in the dump are in `download_history`. Landing it in
# `books` with two alias objects means the application's own configuration is untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmeabook
  namespace: books
  labels:
    app: readmeabook
spec:
  # LIVE since the cutover of 2026-08-08. It was staged at 0 — safe here because
  # readmeabook publishes no host port, has no bridge Service of its own, and nothing on
  # either runtime consumes the name, so unlike plex there was no selectorless Service to
  # overwrite and black-hole — and raised here, in git, only after docker had stopped and
  # both volumes had been cold-copied.
  #
  # ⚠️ The copied PGDATA is CRASH-CONSISTENT, not cleanly shut down: `pg_controldata`
  # read `Database cluster state: in production` after `docker stop`, because supervisord
  # does not give Postgres a graceful shutdown. Postgres replays WAL on first start,
  # which is exactly what it is designed to do — but it means the gate on this migration
  # was never "the copy is clean", it was "there are two independent ways back":
  # the untouched source volume `rmab-pgdata`, and a restore-TESTED pg_dumpall in
  # /storage2/backup/readmeabook-precutover-20260808-124110.
  replicas: 1
  selector:
    matchLabels:
      app: readmeabook
  # Two Postgres processes on one PGDATA is how you lose it. A rolling update would do
  # exactly that.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: readmeabook
    spec:
      # ⛔ REQUIRED, not decoration. The image is multi-arch, so without this the
      # scheduler may place it on pelargir — where none of these hostPaths exist. With
      # `type: Directory` the Pod would then sit Pending FOREVER, after docker has
      # already been stopped. Found by cross-review.
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      # This is a root-running web application. Docker never handed it a Kubernetes
      # credential and neither should this.
      automountServiceAccountToken: false
      # supervisord stops Postgres on SIGTERM; give it room to checkpoint rather than
      # be killed mid-write. A hard kill is survivable (Postgres recovers on start) but
      # there is no reason to rely on it.
      terminationGracePeriodSeconds: 120
      containers:
        - name: readmeabook
          # Digest-pinned, and here that is a REAL change: compose says `:latest`, so a
          # re-pull could silently upgrade a database application and migrate its schema
          # under us. This digest was verified to be exactly what docker was running —
          # containerd's repoDigest equals docker's image Id.
          image: ghcr.io/kikootwo/readmeabook@sha256:374bdcb2947ad6794d1ef14fd0c004fd8fedeb861339275c53457168e2ec5609
          imagePullPolicy: IfNotPresent
          # ⛔ NO runAsUser and NO fsGroup. PGDATA is owned by uid 102 (the image's
          # postgres user) with mode 0750, and Postgres refuses to start if the data
          # directory is not owned by the user running it. The container starts as root
          # and supervisord drops privileges itself, exactly as on docker. A hostPath
          # does not remap uids, so the copied ownership is what Postgres will see.
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: America/Los_Angeles }
            - { name: PUBLIC_URL, value: "https://bookrequests.saldivar.io" }
            # ⛔ ALL FOUR ARE DELIBERATELY EMPTY, and must stay that way. Compose sets
            # them from ${RMAB_*} variables that resolve to empty strings; verified on
            # the live container (len 0), not inferred from the file.
            #
            # This is not cosmetic. `configuration.audiobookshelf.api_token` is stored
            # ENCRYPTED, and CONFIG_ENCRYPTION_KEY is what decrypts it — if the image
            # generated a fresh key because the variable were absent, that token would
            # become permanently unreadable. Likewise POSTGRES_PASSWORD empty is what
            # the existing cluster's local trust auth was initialised with.
            #
            # Declaring them explicitly as "" is therefore SAFER than omitting them:
            # omission lets the image invent values.
            - { name: JWT_SECRET, value: "" }
            - { name: JWT_REFRESH_SECRET, value: "" }
            - { name: CONFIG_ENCRYPTION_KEY, value: "" }
            - { name: POSTGRES_PASSWORD, value: "" }
          ports:
            # No hostPort: compose published nothing. This is reached only through
            # traefik, via the Service below.
            - { name: http, containerPort: 3030 }
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              # Safe to limit, unlike the transcoders: nothing here writes to a tmpfs
              # that would be charged to this cgroup. Postgres + Redis + Node against a
              # measured ~279 M working set.
              memory: 2Gi
          # Mirrors the image's OWN healthcheck exactly — `curl -f
          # http://localhost:3030/api/health`, 30 s interval, 10 s timeout, 3 retries,
          # 60 s start period. `/api/health` returns 200 and was verified live; `/health`
          # and `/api/status` are both 404, so a guessed path would leave this Pod
          # permanently NotReady.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            # Generous: Postgres recovery plus a Next.js cold start. The startup gate
            # keeps readiness and liveness dormant meanwhile.
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: config, mountPath: /app/config }
            - { name: cache, mountPath: /app/cache }
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: redis, mountPath: /var/lib/redis }
            - { name: downloads, mountPath: /downloads }
            - { name: media, mountPath: /media }
            - { name: ebooks, mountPath: /ebooks }
      volumes:
        # `type: Directory` everywhere — the default type CREATES a missing path, and
        # for pgdata that would mean Postgres initialising an EMPTY cluster over a
        # missing mount instead of failing loudly. That is the difference between an
        # outage and silent data loss.
        - name: config
          hostPath: { path: /usr/local/etc/readmeabook/config, type: Directory }
        - name: cache
          hostPath: { path: /usr/local/etc/readmeabook/cache, type: Directory }
        # Cold-copied from the docker named volumes `rmab-pgdata` and `rmab-redis`
        # while the container was stopped, preserving numeric ownership (pgdata is
        # 102:1000 mode 0750; redis is 1000:1000).
        - name: pgdata
          hostPath: { path: /usr/local/etc/readmeabook/pgdata, type: Directory }
        - name: redis
          hostPath: { path: /usr/local/etc/readmeabook/redis, type: Directory }
        - name: downloads
          hostPath: { path: /storage/Media/Torrents, type: Directory }
        - name: media
          hostPath: { path: /storage/Media/AudioBooks, type: Directory }
        - name: ebooks
          hostPath: { path: /storage/Media/Books, type: Directory }
---
# ⛔ THE APPLICATION'S OWN SERVICE. Omitting this was caught by cross-review: the
# generated traefik route addresses `readmeabook.books.svc.cluster.local:3030` by DNS,
# so without it the route would return 502 against a perfectly healthy Pod the moment
# docker stopped.
apiVersion: v1
kind: Service
metadata:
  name: readmeabook
  namespace: books
  labels:
    app: readmeabook
spec:
  selector:
    app: readmeabook
  ports:
    - { name: http, port: 3030, targetPort: http }
---
# ALIAS 1 — `prowlarr` lives in the `media` namespace, and readmeabook asks for it by
# bare name. An ExternalName Service is a DNS CNAME, so `http://prowlarr:9696` from a
# Pod in `books` resolves through to prowlarr's ClusterIP in `media`.
#
# It does no port mapping, which is fine ONLY because the ports match on both sides
# (9696). If prowlarr's Service port ever changes, this silently breaks — the CNAME will
# still resolve and the connection will be refused.
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: books
  labels:
    alias.saldivar.io/target: cross-namespace
spec:
  type: ExternalName
  externalName: prowlarr.media.svc.cluster.local
---
# ALIAS 2 — `gluetun`. MIGRATED 2026-08-09: now SELECTOR-BACKED, pointing at the
# books-netns Pod (gluetun + qbittorrent-books + flaresolverr-books sharing one netns, the
# shape docker was emulating with network_mode: container:). The hand-written
# `gluetun-docker` EndpointSlice was DELETED here in the same change, which prunes it — no
# hand-written kubectl delete, which would make the forward path and rollback disagree
# about ownership.
#
# ⛔ THE NAME STAYS `gluetun` even though it fronts qBittorrent's WebUI. readmeabook has
# `gluetun` configured as its download-client host; renaming this breaks readmeabook
# SILENTLY. The name is a docker artifact and it is load-bearing.
#
# ⛔ NO `clusterIP:` — an in-place update preserves 10.43.79.212. Service UID equality is
# the gate proving this was a patch, not a delete-and-recreate across two AddOns.
#
# ✅ It is now HEALTH-AWARE, which the bridge never was: the endpoint is the Pod, so a
# failed qBittorrent withdraws it. The old comment's warning — that a dropped tunnel looked
# identical to a healthy bridge — no longer applies. ⚠️ flaresolverr deliberately has NO
# readinessProbe so its health cannot withdraw this Service from readmeabook.
apiVersion: v1
kind: Service
metadata:
  name: gluetun
  namespace: books
  labels: { app: books-netns }
spec:
  selector: { app: books-netns }
  ports:
    - { name: qbittorrent, port: 8080, targetPort: http, protocol: TCP }
