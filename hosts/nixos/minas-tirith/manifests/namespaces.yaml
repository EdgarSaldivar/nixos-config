# Namespaces for minas-tirith workloads.
#
# POD SECURITY — audit/warn, NOT enforce, where workloads require NET_ADMIN,
# host devices, host ports, or hostPath. Enforcing Baseline without first removing
# those declared requirements would reject Pods at admission. Audit/warn preserves
# the signal without claiming those workloads satisfy Baseline. Authentik is the
# exception because its declared capabilities fit the enforced posture below.
apiVersion: v1
kind: Namespace
metadata:
  name: books
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # NOTE: no `enforce` label. See above.
    #
    # ⛔ No default-deny NetworkPolicy is declared yet. Add it only with explicit,
    # tested allows for ingress, DNS, storage, and cross-namespace dependencies; see
    # the corresponding ROADMAP item. Test with fresh connections because conntrack
    # can let established flows survive a policy change.
    migration.saldivar.io/phase: "2-canary"
---
# `media` — the largest workload namespace. Same posture as books: audit/warn, no
# enforce, and no default-deny NetworkPolicy until the required allows are tested.
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    migration.saldivar.io/phase: "3-wave1"
---
# `games` — same posture as books/media: audit/warn, no enforce, and no default-deny
# NetworkPolicy until the required allows are tested.
apiVersion: v1
kind: Namespace
metadata:
  name: games
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    migration.saldivar.io/phase: "3-wave1"
---
# nextcloud gets its OWN namespace: it is the largest-state workload on this fleet
# (1.5 TB of user data) and keeping it separate means its RBAC, quotas and any future
# NetworkPolicy cannot be confused with media or books workloads.
#
# ⛔ Same posture as the others: audit/warn, NO `enforce`, and NO default-deny
# NetworkPolicy until ingress, DNS, storage, and application allows are tested.
apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# `immich` gets its OWN namespace, keeping its database and future RBAC, quotas or
# policy separate from media workloads.
#
# ⛔ Same posture as nextcloud: audit/warn, NO `enforce`, and NO default-deny
# NetworkPolicy until ingress, DNS, storage, and application allows are tested.
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# `traefik` gets its OWN namespace because it is the cluster-external ingress
# boundary for minas' 26 hostnames.
#
# ⛔ Same posture as nextcloud/immich: audit/warn, NO `enforce`, and NO
# default-deny NetworkPolicy. ⚠️ Its required hostPort 80/443 trips the baseline
# warning; that warning is expected and must not be "fixed" by removing hostPort.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# `authentik` enforces Baseline because PostgreSQL's tightly bounded startup
# capabilities fit it. Server and worker meet Restricted, whose stricter rules remain
# visible as audit/warn signal without blocking the database entrypoint.
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# PinCollector is clean-slate in Kubernetes even though its data is restored from
# Compose. Its containers run non-root and fit the Restricted policy.
apiVersion: v1
kind: Namespace
metadata:
  name: pin-collector
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
