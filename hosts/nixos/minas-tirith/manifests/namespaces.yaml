# Namespaces for services migrating off docker on minas-tirith.
#
# Created one at a time as services arrive, rather than all six up front: an empty
# namespace with a posture applied is a claim that the posture was tested, and it
# has not been until something runs in it.
#
# POD SECURITY — audit/warn, NOT enforce.
# Deliberate. The inventory contains privileged workloads (deluge-vpn, deluge-books),
# NET_ADMIN (gluetun), host devices (plex, jellyfin) and hostPath everywhere. Turning
# on `enforce` before those are individually assessed would reject them at admission,
# and the failure arrives as "pod not created" with no running workload to inspect.
# audit/warn records the same violations in the API audit log and in kubectl output
# while letting the migration proceed, which is what makes the labels useful now
# rather than a blocker to be removed later.
apiVersion: v1
kind: Namespace
metadata:
  name: books
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # NOTE: no `enforce` label. See above.
    migration.saldivar.io/phase: "2-canary"
---
# Default-deny ingress for the books namespace.
#
# MEASURED SEMANTICS — this does less than the name suggests, and the difference
# matters more than the policy itself.
#
# I originally skipped this because public traffic arrives from the docker `traefik2`
# container, outside the cluster, and I expected default-deny to cut it off and take
# the service down. **That was wrong, and testing it took ten minutes.** Measured on
# this cluster with the policy applied:
#
#   pod -> pod                                    BLOCKED    (the policy enforces)
#   traefik2 -> pod (via the node)                ALLOWED    (exempt)
#
# Traffic entering from outside is SNATed to the node's cni0 gateway (10.42.1.1 — a Pod
# sees exactly that as RemoteAddr; the real client survives only in X-Forwarded-For,
# which NetworkPolicy cannot match on). kube-router treats node-sourced traffic as
# exempt so that a user policy can never lock out kubelet health probes — which also
# means it can never block the docker ingress path.
#
# ⛔ SO BE HONEST ABOUT WHAT THIS BUYS:
#   ✅ pod-to-pod isolation — a compromised service in another namespace cannot reach
#      these Pods directly. That is real and is the reason to have it.
#   ❌ NOTHING against anything arriving through the node, which today is *all* public
#      traffic. Do not read "default-deny" as "this namespace is firewalled".
#
# That gap closes in Phase 6 when ingress moves into the cluster: the source becomes
# the traefik Pod, selectable by label, and the allow rule can then be specific instead
# of relying on an exemption.
#
# No egress rules on purpose. policyTypes lists Ingress only, so egress stays
# unrestricted — an egress default-deny would need explicit DNS and upstream rules and
# is a separate, deliberate step, not a freebie to bundle here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: books
spec:
  podSelector: {}
  policyTypes: [Ingress]
