# Namespaces for services migrating off docker on minas-tirith.
#
# Created one at a time as services arrive, rather than all six up front: an empty
# namespace with a posture applied is a claim that the posture was tested, and it
# has not been until something runs in it.
#
# POD SECURITY — audit/warn, NOT enforce.
# Deliberate. The inventory contains privileged workloads (deluge-vpn, deluge-books),
# NET_ADMIN (gluetun), host devices (plex, jellyfin) and hostPath everywhere. Turning
# on `enforce` before those are individually assessed would reject them at admission,
# and the failure arrives as "pod not created" with no running workload to inspect.
# audit/warn records the same violations in the API audit log and in kubectl output
# while letting the migration proceed, which is what makes the labels useful now
# rather than a blocker to be removed later.
apiVersion: v1
kind: Namespace
metadata:
  name: books
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # NOTE: no `enforce` label. See above.
    #
    # ⛔ NO default-deny NetworkPolicy, and this is now a MEASURED conclusion rather
    # than a guess. It is a deviation from the Phase 1 plan and it stays until Phase 6.
    #
    # Applying `podSelector: {} / policyTypes: [Ingress]` to this namespace takes every
    # service in it OFFLINE (verified the hard way: audiobookshelf returned 502 until
    # the policy was removed). Public traffic arrives from the docker `traefik2`
    # container, outside the cluster, and there is NO allow rule that can readmit it:
    #
    #   - the Pod sees the source as 10.42.1.1 on every path (docker bridge,
    #     traefik-net, and the host itself) — traffic is SNATed to the node's cni0
    #     gateway, and the real client survives only in X-Forwarded-For, which
    #     NetworkPolicy cannot match on;
    #   - `ipBlock: 10.42.1.1/32` does NOT admit it, nor does `ipBlock: 10.42.0.0/16`.
    #     ipBlock only matches sources OUTSIDE the cluster network, and 10.42.1.1 sits
    #     inside the pod CIDR while belonging to no Pod — so podSelector cannot match
    #     it either. It falls between the two selector types.
    #
    # ⚠️ A NON-OBVIOUS TESTING TRAP, recorded because it produced a confident wrong
    # answer: probing through traefik appears to show the policy having NO effect.
    # traefik pools upstream connections and conntrack lets ESTABLISHED flows through
    # regardless of NetworkPolicy, so only NEW connections are blocked. Testing via a
    # warm traefik connection "proves" traffic is exempt when it is not. Probe with a
    # fresh TCP connection (a throwaway `docker run ... nc`) or the result is worthless.
    #
    # This costs less than it sounds: pod-to-pod isolation is what default-deny would
    # actually buy, and `books` currently holds one service with no dependencies in
    # either direction. The policy becomes both possible and useful in Phase 6, when
    # ingress moves into the cluster and the source becomes a Pod selectable by label.
    migration.saldivar.io/phase: "2-canary"
