# nextcloud — the largest-state workload on this fleet, and the one three earlier scopes
# were rejected for. Read the nextcloud section of K3S-HANDOFF.md before touching this.
#
# ⛔ 1.5 TB of user data at /storage2/nextcloud/data, which is NOT a backup source.
#
# ⛔ THE EXISTING SNAPSHOT IS NOT THE ROLLBACK. An earlier version of this header claimed
# it was. Cross-review disproved that on two counts, both verified:
#   1. `storage2@nextcloud-precutover-20260809T084029Z` was taken while all three docker
#      containers were RUNNING — a torn moment — and the database dump was taken
#      separately, so the two do not correspond to the same filesystem state.
#   2. The 606 MB app tree at /usr/local/lib/docker-nextcloud, WHICH CONTAINS config.php,
#      lives on /dev/mapper/cr_root at `/` — a DIFFERENT FILESYSTEM. The snapshot never
#      covered it.
#
# ✅ THE ROLLBACK MUST BE BUILT AT CUTOVER, quiesced and coherent: maintenance mode ->
# stop every writer -> stop PostgreSQL cleanly -> prove no open handles -> THEN a fresh
# snapshot AND a stopped archive of the app tree, taken at the same moment.
#
# ⛔ And restoring is NOT `zfs rollback storage2@…` — that is the entire 3.1 TB parent
# dataset and repeats the unrelated-tree blast radius that got an earlier scope rejected.
# Use a clone or a selective restore.
#
# ✅ The DATABASE additionally has a real, restore-TESTED dump (13M, pg_dump -Fc,
# pg_restore exit 0 into an isolated postgres:14.5 with row counts matched against live:
# oc_users 4/4, oc_filecache 124415/124415, oc_storages 5/5).
#
# ⛔ TWO WORKLOADS, NOT THREE — and NOT one multi-container Pod.
#   * The app and the database are SEPARATE Deployments joined by a Service, so the
#     database is never restarted merely because the app is, and each can be scaled to
#     zero independently during a cutover or a restore.
#   * `nextcloud-redis` IS DELIBERATELY NOT MIGRATED. MEASURED: nextcloud's
#     `memcache.local` is `\OC\Memcache\APCu` (in-process), while `memcache.distributed`,
#     `memcache.locking` and `redis` are ALL UNSET, redis holds 0 keys, and its data
#     directory is 93 bytes. Nothing uses it. That is also why its healthcheck could fail
#     7161 consecutive times unnoticed — it runs `redis-cli -a <password>` against a server
#     with no `requirepass`. ⚠️ Do not "restore" this container without first configuring
#     nextcloud to actually use it; porting the broken healthcheck yields a Pod that never
#     becomes Ready.
#
# ⛔ STAGED AT replicas: 0, NO Services. The Services, the traefik route and the docker
# stop all land at cutover.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-db
  namespace: nextcloud
  labels:
    app: nextcloud-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-db
  # ⛔ Two Postgres processes on one PGDATA is how the database is lost. Never RollingUpdate.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Postgres needs room to checkpoint; a SIGKILL mid-checkpoint means WAL replay at
      # best and corruption at worst.
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: verify-pgdata
          image: postgres@sha256:135c62a8134dcef829a1e4f5568bfae44bcfa2c75659ff948f43c71964366aa4
          imagePullPolicy: IfNotPresent
          # ⛔ Refuse an empty or wrong hostPath before the image can initialise a fresh
          # cluster over it. This mount is read-only: validation must never create, move or
          # repair database state.
          #
          # ⚠️ CONSEQUENCE, AND IT IS DELIBERATE: **this Pod will also refuse to start after
          # an UNCLEAN shutdown.** A node crash, power loss or OOM kill leaves
          # `cluster_state: in production` and a stale `postmaster.pid`, which Postgres could
          # normally recover from by replaying WAL — so this gate turns a self-healing case
          # into a CrashLoopBackOff. That is the intended trade while the docker container is
          # retained and startable, because this check CANNOT distinguish "crashed" from "a
          # live docker postmaster still holds this PGDATA": that process is in a different
          # PID/IPC namespace, so neither this gate nor Postgres's own stale-lock logic can
          # see it. Two postmasters on one PGDATA loses the database; a CrashLoopBackOff does
          # not.
          #
          # ✅ VERIFIED 2026-08-09 against all three inputs: the cleanly-shut-down snapshot
          # PGDATA passes (exit 0), an empty directory fails (exit 1), and the live PGDATA
          # with docker Postgres running fails (exit 1).
          #
          # ✅ To recover from a genuine crash, first PROVE no other postmaster holds it:
          #      sudo docker ps -a --filter name=nextcloud-db     # must be Exited
          #      sudo lsof /storage2/nextcloud/db | wc -l          # must be 0  (check lsof's
          #                                                        #  own exit status too)
          #    then let Postgres replay WAL by starting once without this initContainer.
          #
          # ⛔ REVISIT once the migration is accepted and the docker container is gone. At
          # that point the cross-runtime risk this defends against no longer exists, and the
          # gate is trading availability for nothing.
          command:
            - sh
            - -ec
            - |
              set -eu
              test -f "$PGDATA/PG_VERSION"
              test "$(cat "$PGDATA/PG_VERSION")" = 14
              test -s "$PGDATA/global/pg_control"
              test -d "$PGDATA/base"
              # ⛔ A second container can also be PID 1 and has a separate IPC namespace,
              # so Postgres's own stale-lock checks cannot prove the docker postmaster stopped.
              test ! -e "$PGDATA/postmaster.pid"
              control_data="$(pg_controldata "$PGDATA")"
              cluster_state="$(
                awk -F ': *' '$1 == "Database cluster state" { print $2 }' <<EOF
              $control_data
              EOF
              )"
              test "$cluster_state" = "shut down"
              system_identifier="$(
                awk -F ': *' '$1 == "Database system identifier" { print $2 }' <<EOF
              $control_data
              EOF
              )"
              case "$system_identifier" in
                ''|*[!0-9]*) echo "pg_controldata did not return a valid database system identifier" >&2; exit 1 ;;
              esac
              # ⚠️ Print, but do not assert, the identifier: a supported logical restore
              # creates a new physical cluster identifier and must remain startable.
              echo "Verified shut-down PostgreSQL 14 cluster at $PGDATA (system identifier: $system_identifier)"
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data, readOnly: true }
      containers:
        - name: nextcloud-db
          image: postgres@sha256:135c62a8134dcef829a1e4f5568bfae44bcfa2c75659ff948f43c71964366aa4
          imagePullPolicy: IfNotPresent
          # ⛔ NO runAsUser and NO fsGroup. PGDATA carries its own numeric ownership and a
          # hostPath does not remap uids; Postgres refuses to start on a data directory it
          # does not own. The image drops privileges itself.
          env:
            - { name: TZ, value: America/Los_Angeles }
            # ⛔ The database is literally named `nextcloud-db` — the same string as the
            # container and the Service. That is confusing but it is what exists; changing
            # it is a data migration, not a rename.
            - { name: POSTGRES_DB, value: nextcloud-db }
            # ⛔ THIS COMMENT USED TO CLAIM the postgres image reads these from env ONLY,
            # as a documented exception to the Secret-volume rule. THAT IS FACTUALLY WRONG:
            # the official image supports POSTGRES_PASSWORD_FILE / POSTGRES_USER_FILE /
            # POSTGRES_DB_FILE, and the nextcloud image documents _FILE variants too.
            #
            # ⚠️ AND on an EXISTING PGDATA, POSTGRES_PASSWORD does not change the stored
            # role password — it is an initialisation-time variable. So rotating this
            # Secret can appear to succeed while the actual database role is unchanged.
            # Convert to Secret volumes + _FILE before relying on rotation here.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: nextcloud-postgres, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: nextcloud-postgres, key: password }
            # PGDATA is the mount root here, matching the docker layout exactly.
          ports:
            - { name: pg, containerPort: 5432 }
          # ⛔ pg_isready, NOT a TCP check: Postgres accepts connections before it is ready
          # to serve, and during WAL replay a TCP probe passes while queries fail.
          startupProbe:
            exec: { command: ["sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            # ✅ A real query proves the named database and user authenticate. pg_isready
            # can pass during WAL replay or when the configured credentials cannot query.
            exec:
              command:
                - sh
                - -ec
                - |
                  result="$(psql -X -v ON_ERROR_STOP=1 -Aqt -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1")"
                  test "$result" = 1
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
      volumes:
        # ⛔ `type: Directory`. The default CREATES a missing path, which for PGDATA means
        # initialising an EMPTY cluster over a missing mount and presenting as a working
        # nextcloud with no users.
        #
        # ⚠️ THE SAME PATH THE DOCKER CONTAINER USES. Unlike the deluge migrations there is
        # no cold copy: the app tree, the database and 1.5 TB of files must stay consistent
        # with each other, and the files cannot be copied. The quiesced snapshot + app-tree
        # archive described in the header is the rollback instead — NOT the pre-existing
        # snapshot, which is torn and does not cover the app tree.
        #
        # ⛔ `type: Directory` does NOT prove this is a VALID cluster — an existing empty or
        # wrong directory passes and the postgres image will initialise a FRESH cluster over
        # it, after which the probes pass with the real 4 users absent. The read-only init
        # container enforces PG_VERSION=14, a non-empty global/pg_control, base/, no live
        # postmaster marker, and parseable pg_controldata reporting a shut-down cluster
        # before Postgres is allowed to start.
        - name: pgdata
          hostPath: { path: /storage2/nextcloud/db, type: Directory }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nextcloud
  # ⛔ Single writer. Two nextcloud instances on one data directory corrupt file locking.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: nextcloud
          image: nextcloud@sha256:48b5cc1237da4886d0222098b7252316e141bebde37f37268771518d092e7ad4
          imagePullPolicy: IfNotPresent
          env:
            - { name: TZ, value: America/Los_Angeles }
            # ⛔ Points at the SERVICE name, which is deliberately identical to the docker
            # container name `nextcloud-db` — that is what config.php already contains, so
            # keeping the name means the existing config keeps working untouched.
            - { name: POSTGRES_HOST, value: nextcloud-db }
            - { name: POSTGRES_DB, value: nextcloud-db }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: nextcloud-postgres, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: nextcloud-postgres, key: password }
            # Preserved verbatim from the docker container. OVERWRITEPROTOCOL is
            # load-bearing behind traefik: without it nextcloud generates http:// URLs and
            # browsers block them as mixed content.
            - { name: OVERWRITEPROTOCOL, value: https }
            - { name: OVERWRITECLIURL, value: "https://drive.saldivar.io" }
            - { name: NEXTCLOUD_TRUSTED_DOMAINS, value: drive.saldivar.io }
            - { name: GLOBAL_MAX_BODY_SIZE, value: 30M }
            - { name: CLIENT_MAX_BODY_SIZE, value: 30M }
          ports:
            - { name: http, containerPort: 80 }
          # ⚠️ /status.php is nextcloud's own health endpoint and answers 200 with JSON even
          # while logged out. It also answers during maintenance mode, so it proves the app
          # is serving — not that it is usable. Good enough for liveness, deliberately.
          startupProbe:
            httpGet: { path: /status.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            # 1.5 TB of data and a 170 MB database: first start after a move can be slow.
            failureThreshold: 60
          readinessProbe:
            # ✅ Ready means nextcloud is installed, out of maintenance mode, AND can query
            # the database configured in its mounted config.php. Existing installations
            # ignore the POSTGRES_* install-time variables; credentials are therefore read
            # inside PHP and never exposed in process argv.
            exec:
              command:
                - sh
                - -ec
                - |
                  set -eu
                  status_file="$(mktemp)"
                  trap 'rm -f "$status_file"' EXIT
                  http_code="$(curl --silent --show-error --max-time 5 --output "$status_file" --write-out '%{http_code}' http://127.0.0.1/status.php)"
                  test "$http_code" = 200
                  php -r '
                    $status = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
                    if (($status["installed"] ?? null) !== true || ($status["maintenance"] ?? null) !== false) { exit(1); }
                    require "/var/www/html/config/config.php";
                    if (!isset($CONFIG) || !is_array($CONFIG) || ($CONFIG["dbtype"] ?? null) !== "pgsql") { exit(1); }
                    foreach (["dbhost", "dbname", "dbuser", "dbpassword"] as $key) {
                      if (!isset($CONFIG[$key]) || !is_string($CONFIG[$key]) || $CONFIG[$key] === "") { exit(1); }
                    }
                    $dsn = "pgsql:host=".$CONFIG["dbhost"].";dbname=".$CONFIG["dbname"];
                    if (isset($CONFIG["dbport"]) && (string) $CONFIG["dbport"] !== "") { $dsn .= ";port=".$CONFIG["dbport"]; }
                    $db = new PDO($dsn, $CONFIG["dbuser"], $CONFIG["dbpassword"], [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT=>5]);
                    if ((string) $db->query("SELECT 1")->fetchColumn() !== "1") { exit(1); }
                  ' "$status_file"
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 6Gi }
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
            # ⚠️ THE SAME DIRECTORY IS MOUNTED TWICE, exactly as docker had it.
            # `datadirectory` in config.php is /var/www/html/data — that is the real one.
            # /var/www/data is almost certainly vestigial, but removing a mount that the
            # running system has is a change of behaviour, not a tidy-up; it is preserved
            # and can be dropped once something proves nothing reads it.
            - { name: ncdata, mountPath: /var/www/html/data }
            - { name: ncdata, mountPath: /var/www/data }
      volumes:
        # The app tree — 606M, and unlike the data it IS covered by the filesystem backup.
        - name: html
          hostPath: { path: /usr/local/lib/docker-nextcloud, type: Directory }
        # ⛔ 1.5 TB of irreplaceable user data. `type: Directory` so a typo cannot create an
        # empty directory and present nextcloud with zero files.
        - name: ncdata
          hostPath: { path: /storage2/nextcloud/data, type: Directory }
---
# ⛔ BOTH SERVICES ARE STAGED WHILE replicas STAY 0, deliberately. Review finding: raising
# replicas without a `nextcloud-db` Service leaves the app unable to resolve the database
# host its config.php already names, so it would start, fail to connect, and — with
# /status.php as readiness — potentially still be routed traffic.
#
# Staging them now is INERT: a Service with no ready endpoints routes nothing, and the
# traefik file route sits at priority 1 so the docker router keeps the hostname until the
# container stops.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-db
  namespace: nextcloud
  labels: { app: nextcloud-db }
spec:
  selector: { app: nextcloud-db }
  ports:
    - { name: pg, port: 5432, targetPort: pg, protocol: TCP }
---
# The name matches what traefik-routes.nix derives from its attribute key (`nextcloud`),
# and what the staged route addresses as nextcloud.nextcloud.svc.cluster.local:80.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
  labels: { app: nextcloud }
spec:
  selector: { app: nextcloud }
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
#
# ⛔ NOT PORTED: /home/edgar/git/docker/.my_custom_proxy_settings.conf, which docker mounts
# to /etc/nginx/conf.d/my_custom_proxy_settings.conf. This image is `nextcloud:28-apache`
# — there is no nginx in it and nothing reads that path. It is dead config from an earlier
# nginx-based setup. If proxy tuning is actually needed it belongs in the traefik route or
# in apache config, not here.
