# Frozen basename: this AddOn retains ownership of Services that originated as
# bridges. Renaming it or moving its objects would change AddOn ownership.
#
# WHY
# ---
# Workloads reference peers by bare name. Inside a namespace that name resolves to a
# Service, so the Service name and owner are load-bearing application configuration.
#
# ⚠️ THESE BRIDGES ARE NOT HEALTH-AWARE.
# Kubernetes will keep advertising 10.0.1.6 when the docker process is stopped, crashed,
# or has had its published port changed. Nothing here notices. Each bridge needs a
# synthetic probe against the EXACT url its consumer uses — a Pod being Ready proves
# nothing about the far side.
#
# ⚠️ Never combine a selector-backed Service with a manual EndpointSlice for the
# same backend. Ownership transitions must remove the old objects explicitly and
# preserve a coherent rollback path.
#
# ── EndpointSlice, NOT Endpoints ──────────────────────────────────────────────
# `v1 Endpoints` was the obvious choice and is wrong: it reaches EndpointSlice only via
# the mirroring path, and both were deprecated in 1.33. A manually-managed
# discovery.k8s.io/v1 EndpointSlice is the SUPPORTED pattern for external backends.
# The `managed-by` label is deliberately a non-reserved value so the EndpointSlice
# controller treats these as none of its business and never reconciles them away.
#
# NOTE the value is `migration.saldivar.io-manual`, with a DASH. Label VALUES may not
# contain `/` (only keys may), so the natural `migration.saldivar.io/manual` is rejected
# by the API server — and it fails in a nasty way: the selectorless Services are created
# successfully while every EndpointSlice is refused, leaving Services that resolve and
# then refuse every connection.
---
# No plex object belongs to this AddOn; manifests/plex.yaml owns its selector-backed
# Service and pins ClusterIP 10.43.57.77. Do not reintroduce a `plex-docker`
# EndpointSlice: it would inject a second backend while the Service still appeared
# healthy. This AddOn sorts before minas-plex.yaml, so any future ownership change
# must account for prune-before-recreate ordering.
---
# No flaresolverr object belongs to this AddOn; manifests/flaresolverr.yaml owns its
# selector-backed Service. Do not add a manual EndpointSlice beside that selector.
# k3s does not prune an AddOn merely because an installed file disappears, which is
# why the frozen basename and explicit ownership are safety invariants.
---
# deluge-books: this selector-backed Service points at the Pod in
# vpn-deluge-books.yaml and remains under this AddOn's ownership.
#
# ⛔ IT STAYS IN THIS FILE, and that is deliberate. Moving it to the workload's own
# manifest would be a delete-and-recreate ACROSS TWO AddOns — the AddOn that applies
# later prunes the Service the other just created. Updating it in place is a plain patch
# on one object with one owner: no prune, no recreate, no window with no Service, and no
# need to pin the ClusterIP. The awkward filename is the price and it is worth paying.
#
# ⛔ NO `clusterIP:` FIELD. An in-place update PRESERVES the existing 10.43.117.204;
# writing it here would add nothing and would invite someone to "fix" it later into the
# delete-and-recreate this design exists to avoid. Service UID equality is the gate that
# proves this was a patch and not a recreation.
#
# ⛔ Keep removal declarative under the owning AddOn. Mixing an in-file removal with
# a manual delete makes the forward path and rollback disagree about ownership.
#
# targetPort changes 9812 -> `http`: 9812 was the docker HOST port; the Pod's container
# port is 8112, named `http`.
apiVersion: v1
kind: Service
metadata:
  name: deluge-books
  namespace: media
  labels: { app: deluge-books }
spec:
  selector: { app: deluge-books }
  # Gluetun readiness is health signaling, not an instruction to hide Deluge's
  # local admin UI. Keep the Pod endpoint published during a tunnel outage so
  # Traefik can still route the UI for diagnosis and recovery.
  publishNotReadyAddresses: true
  ports:
    - { name: deluge, port: 8112, targetPort: http, protocol: TCP }
---
# deluge-vpn: published 1:1, so Service port and host port are both 8112.
# This selector-backed Service points at the Pod in vpn-deluge-vpn.yaml and remains
# under this AddOn's ownership. Do not add a manual EndpointSlice or hand-delete the
# Service; either would make the forward path and rollback disagree about ownership.
#
# ⛔ IT STAYS IN THIS FILE and carries NO `clusterIP:`. An in-place update preserves
# 10.43.167.246; moving it to the workload manifest would be a delete-and-recreate across
# two AddOns, where the later-applying one prunes what the other just created. Service UID
# equality is the gate that proves this was a patch.
#
# ⚠️ targetPort is now the CONTAINER port, which happens to equal the old host port because
# this service published 1:1 — unlike deluge-books, whose 8112 was published as 9812. Do
# not read that equality as "nothing changed here".
apiVersion: v1
kind: Service
metadata:
  name: deluge-vpn
  namespace: media
  labels: { app: deluge-vpn }
spec:
  selector: { app: deluge-vpn }
  # See deluge-books above: a failed tunnel must not withdraw the local admin UI.
  publishNotReadyAddresses: true
  ports:
    - { name: deluge, port: 8112, targetPort: http, protocol: TCP }
