# animearr — the second sonarr instance in the atomic media wave.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: animearr
  namespace: media
  labels:
    app: animearr
spec:
  # LIVE — and this value must keep MATCHING THE CLUSTER. It read `replicas: 0`
  # while the Deployment ran at 1, from its cutover until 2026-08-08, because the
  # cutover used `kubectl scale` instead of changing this line. k3s auto-deploy
  # re-applies a manifest when its file checksum changes OR when the server
  # restarts, so either event would have reasserted the declared 0 and taken the
  # service down with nothing in git to explain it. Hand-scaling survived ordinary
  # rebuilds only because installing byte-identical content does not change the
  # checksum — which is exactly what kept this invisible.
  # See K3S-HANDOFF.md, "DURABLE STATE BELONGS IN GIT".
  replicas: 1
  selector:
    matchLabels:
      app: animearr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: animearr
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      initContainers:
        # Match Animearr's preserved 1000:911 runtime identity; see the GUID comment
        # below. A failed link blocks startup instead of allowing copy fallback.
        - name: verify-hardlinks
          image: docker.io/linuxserver/sonarr@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 911
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              source=/storage/Media/Torrents/completed/.animearr-hardlink-preflight-$$
              anime=/storage/Media/Anime/.animearr-hardlink-preflight-$$
              cleanup() { rm -f "$source" "$anime"; }
              trap cleanup EXIT HUP INT TERM
              : > "$source"
              ln "$source" "$anime"
              expected=$(stat -c '%d:%i' "$source")
              [ "$(stat -c '%d:%i' "$anime")" = "$expected" ]
              [ "$(stat -c '%h' "$source")" -eq 2 ]
              echo "hardlink preflight passed: device:inode=$expected links=2"
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: media, mountPath: /storage/Media }
      containers:
        - name: animearr
          # This intentionally matches sonarr's digest: animearr is another instance
          # of the same application, not a different image.
          image: docker.io/linuxserver/sonarr@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8989
              # Compose maps 9292 on the host to 8989 in this instance.
              hostPort: 9292
          env:
            - { name: PUID, value: "1000" }
            # ⛔ GUID is the live compose typo, not PGID. Leaving PGID unset makes the
            # image use group 911, matching the existing 1000:911 config ownership.
            # Correcting it would chown the tree on first start and break docker
            # rollback, so that fix must be a separate, deliberate operation.
            - { name: GUID, value: "1000" }
            - { name: TZ, value: PST }
            # Compose's YAML octal `022` reached docker as decimal 18.
            - { name: UMASK_SET, value: "18" }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /config }
            # A single bind mount is the hardlink boundary. The Deluge remote-path
            # mapping translates its reported /data/* path below this same mount.
            - { name: media, mountPath: /storage/Media }
      volumes:
        - name: config
          hostPath: { path: /home/edgar/docker-services/animearr/config, type: Directory }
        - name: media
          hostPath: { path: /storage/Media, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: animearr
  namespace: media
  labels:
    app: animearr
spec:
  selector:
    app: animearr
  ports:
    - { name: http, port: 8989, targetPort: http }
