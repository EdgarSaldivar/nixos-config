# radarr — a media workload with local single-writer state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
  labels:
    app: radarr
spec:
  # Durable desired state belongs in git: this value must match the intended
  # cluster state. k3s auto-deploy re-applies on a checksum change or server
  # restart, so an imperative scale can be silently reverted. Commit replica
  # changes instead.
  # See docs/architecture/k3s.md, "Durable state belongs in git".
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  strategy:
    # SQLite on a shared hostPath cannot tolerate a rolling pair of writers.
    type: Recreate
  template:
    metadata:
      labels:
        app: radarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: minas-tirith
      enableServiceLinks: false
      initContainers:
        # Radarr otherwise treats a failed hardlink as permission to make a full copy.
        - name: verify-hardlinks
          image: docker.io/linuxserver/radarr@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              source=/storage/Media/Torrents/completed/.radarr-hardlink-preflight-$$
              movies=/storage/Media/Movies/.radarr-hardlink-preflight-$$
              anime=/storage/Media/Anime/.radarr-hardlink-preflight-$$
              cleanup() { rm -f "$source" "$movies" "$anime"; }
              trap cleanup EXIT HUP INT TERM
              : > "$source"
              ln "$source" "$movies"
              ln "$source" "$anime"
              expected=$(stat -c '%d:%i' "$source")
              [ "$(stat -c '%d:%i' "$movies")" = "$expected" ]
              [ "$(stat -c '%d:%i' "$anime")" = "$expected" ]
              [ "$(stat -c '%h' "$source")" -eq 3 ]
              echo "hardlink preflight passed: device:inode=$expected links=3"
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: media, mountPath: /storage/Media }
      containers:
        - name: radarr
          image: docker.io/linuxserver/radarr@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7878
              hostPort: 7878
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            # `PS` is the live container value even though it is a typo for `PST`.
            # Correcting it would shift displayed times; treat that as a separate
            # application behavior change rather than a manifest-lifecycle edit.
            - { name: TZ, value: PS }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # /ping is the verified unauthenticated endpoint for all three probes.
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /config }
            # Keep the completed-download and library paths below one bind mount so
            # Radarr can hardlink. Its Deluge remote-path mapping rewrites /data/* to
            # /storage/Media/Torrents/*.
            - { name: media, mountPath: /storage/Media }
      volumes:
        - name: config
          hostPath: { path: /home/edgar/docker-services/radarr/config, type: Directory }
        - name: media
          hostPath: { path: /storage/Media, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
  labels:
    app: radarr
spec:
  selector:
    app: radarr
  ports:
    - { name: http, port: 7878, targetPort: http }
