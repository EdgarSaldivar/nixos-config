apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: osgiliath
spec:
  # ⛔ ZERO UNTIL COMMISSIONING PREREQUISITES ARE DELIBERATELY SATISFIED. Pelargir
  # delivers this manifest regardless, and the nodeSelector pins it to osgiliath.
  # Raising it before the node is registered and its required paths, devices, and
  # migration gate are ready creates a Pending or init-blocked Pod.
  #
  # Raise all four Osgiliath workloads to 1 IN A COMMIT after commissioning --
  # never with `kubectl scale`.
  # k3s re-applies on checksum change or server restart, so an imperative value
  # would be silently reverted. See docs/architecture/k3s.md.
  replicas: 0
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
      app.kubernetes.io/instance: osgiliath
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/instance: osgiliath
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: osgiliath
      tolerations:
        - key: osgiliath.saldivar.io/workloads
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: migration-ready
          image: docker.io/library/alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - test -f /migration/migration-ready
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
          volumeMounts:
            - name: migration-gate
              mountPath: /migration
              readOnly: true
      containers:
        - name: mosquitto
          image: docker.io/library/eclipse-mosquitto@sha256:b4b46a35b99c198070cf2d2724909c7a2aa583236316a3e1680353164a843040
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: websockets
              containerPort: 9001
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 30
            failureThreshold: 4
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
            - name: log
              mountPath: /var/log/mosquitto
      volumes:
        - name: migration-gate
          hostPath:
            path: /var/lib/osgiliath
            type: Directory
        - name: config
          hostPath:
            path: /var/lib/osgiliath/mosquitto/config
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/osgiliath/mosquitto/data
            type: Directory
        - name: log
          hostPath:
            path: /var/lib/osgiliath/mosquitto/log
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: osgiliath
spec:
  selector:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/instance: osgiliath
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: websockets
      port: 9001
      targetPort: websockets
      protocol: TCP
