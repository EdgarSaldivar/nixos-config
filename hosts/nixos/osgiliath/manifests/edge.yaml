apiVersion: v1
kind: ConfigMap
metadata:
  name: osgiliath-edge-config
  namespace: osgiliath
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        address: ":443"
      health:
        address: ":9000"
    providers:
      file:
        filename: /etc/traefik/dynamic.yaml
        watch: true
    ping:
      entryPoint: health
    api:
      dashboard: false
  dynamic.yaml: |
    http:
      routers:
        home-assistant:
          entryPoints:
            - websecure
          rule: Host(`homeassistant.osgiliath.saldivar.io`)
          service: home-assistant
          tls: {}
      services:
        home-assistant:
          loadBalancer:
            servers:
              # The restored HA config already trusts the host's preserved LAN
              # address as a reverse proxy. Both HA and Frigate also retain
              # this address as their MQTT broker endpoint.
              - url: http://192.168.117.228:8123
    tls:
      certificates:
        - certFile: /tls/tls.crt
          keyFile: /tls/tls.key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: osgiliath-home-assistant
  namespace: osgiliath
spec:
  secretName: osgiliath-edge-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - homeassistant.osgiliath.saldivar.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osgiliath-edge
  namespace: osgiliath
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: osgiliath-edge
      app.kubernetes.io/instance: osgiliath
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osgiliath-edge
        app.kubernetes.io/instance: osgiliath
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: osgiliath
      tolerations:
        - key: osgiliath.saldivar.io/workloads
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: migration-ready
          image: docker.io/library/alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - test -f /migration/migration-ready
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
          volumeMounts:
            - name: migration-gate
              mountPath: /migration
              readOnly: true
      containers:
        - name: traefik
          image: docker.io/library/traefik@sha256:fd5932c796f7e2db9fd6bff485ef693d53797f0ee8ad03dc68aa424ea6f21958
          imagePullPolicy: IfNotPresent
          args:
            - --configFile=/etc/traefik/traefik.yaml
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: health
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: migration-gate
          hostPath:
            path: /var/lib/osgiliath
            type: Directory
        - name: config
          configMap:
            name: osgiliath-edge-config
        - name: tls
          secret:
            secretName: osgiliath-edge-tls
---
apiVersion: v1
kind: Service
metadata:
  name: osgiliath-edge
  namespace: osgiliath
spec:
  selector:
    app.kubernetes.io/name: osgiliath-edge
    app.kubernetes.io/instance: osgiliath
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
