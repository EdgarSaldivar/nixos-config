[[profiles.apps]]
title = "Eglantine"
icon_png_path = "https://raw.githubusercontent.com/Djihads80/Eglantine/build-98/dist/qt_themes/default/icons/256x256/eden.png"
start_virtual_compositor = true

[profiles.apps.runner]
type = "docker"
name = "WolfEglantine"
image = "@EGLANTINE_IMAGE@"
mounts = [
    "/srv/games/switch:/home/retro/Games/Switch:ro",
    "/run/opengl-driver/lib/libnvidia-allocator.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-allocator.so.1:ro",
]
env = [
    "RUN_SWAY=true",
    "GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/nvidia*",
    "__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json:/usr/share/glvnd/egl_vendor.d/50_mesa.json",
    "QT_QPA_PLATFORM=xcb",
    "SDL_VIDEODRIVER=x11",
]
devices = []
ports = []
base_create_json = '''{
  "HostConfig": {
    "IpcMode": "host",
    "Privileged": false,
    "CapAdd": ["NET_RAW", "MKNOD", "NET_ADMIN", "SYS_NICE"],
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}'''
