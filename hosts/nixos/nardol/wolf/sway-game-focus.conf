# Mounted read-only into every Wolf Steam session at
# /etc/sway/config.d/60-nardol-game-focus.conf.
#
# Steam Big Picture runs fullscreen, and sway never raises a newly mapped tiled
# window above a fullscreen one. The upstream image only fullscreens Proton
# games (class steam_app_*), so native Linux games such as Valheim
# (class valheim.x86_64) started with audio but stayed hidden behind Big
# Picture. Fullscreen and focus every other X11 client so it replaces Big
# Picture; Steam's own windows and ES-DE keep their upstream rules. Wayland
# clients (Kitty, YAD dialogs from the mod tools) are left tiled.
for_window [shell="xwayland" class="^(?!steam$|steamwebhelper$|es-de$|Gale$)"] fullscreen enable, focus

# Gale is a desktop utility. Keep it out of the tiling layout even when GTK
# requests to leave fullscreen after mapping its saved window geometry.
for_window [class="^Gale$"] floating enable, resize set 1200 900, move position center, focus
