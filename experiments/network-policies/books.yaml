# Default-deny ingress for the `books` namespace.
#
# ⛔ DRAFT. Not delivered by pelargir/manifests.nix. See ./README.md before applying.
#
# Shape, and why:
#   - deny all INGRESS by default; egress is deliberately left unrestricted, because
#     the workloads here reach the internet and the VPN-gated Pods use their own DNS
#   - re-admit everything from WITHIN this namespace, because these services call each
#     other by bare name and enumerating those edges would be large and fragile
#   - re-admit traefik, which terminates the public hostnames for these workloads
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: books
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: books
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: books
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # ⚠️ Depends on the automatic kubernetes.io/metadata.name label existing on
        # the traefik namespace. Verify with:
        #   kubectl get ns traefik -o jsonpath='{.metadata.labels}'
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-media
  namespace: books
spec:
  # ⛔ THE CROSS-NAMESPACE EDGE. readmeabook reaches prowlarr in `media` through an
  # ExternalName CNAME, and gluetun in this namespace is reached from `media`
  # download clients. Without this rule those calls fail as timeouts, which look
  # like an application fault rather than a policy drop.
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
