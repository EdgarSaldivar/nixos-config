# sops-nix recipient configuration.
#
# Two kinds of key can decrypt each secret:
#   - admin keys: a human, so secrets can be edited (`sops secrets/<file>.yaml`)
#   - host keys:  the machine itself, so it can decrypt at boot
#
# Host recipients are derived from each machine's SSH ed25519 HOST key via
# `ssh-to-age`, so nothing extra has to be provisioned onto the box — sops-nix
# reads /etc/ssh/ssh_host_ed25519_key directly. For minas-tirith this works from
# first boot because the old host keys are restored during the install.
#
# Re-derive at any time:
#   ssh-to-age -i ~/.ssh/id_ed25519.pub                 # admin
#   ssh-keyscan -t ed25519 <host> | ssh-to-age          # a running host
#
# NOTE: an older ~/Development/secrets/.sops.yaml references
# age13rvlj4m79sw79t03qvn3mes9z0dnm4wr9y78t8ph4ydhlqxd8aesxqfx8u, for which no
# matching private key was found on this machine (all identities in
# ~/Development/secrets/age/ derive to age1sj4wrhehz...). Treat that config as
# orphaned; this file supersedes it.

keys:
  # Admin — derived from ~/.ssh/id_ed25519.pub
  - &admin_edgar age1qtxuvlluxvar044vafgq0nj60lmp7lrwt87enl90gl8ssse8acds8zprzk

  # Host — minas-tirith (raz-server), from its /etc/ssh/ssh_host_ed25519_key.pub
  # Host — minas-tirith. REGENERATED 2026-08-05 for the NixOS rebuild.
  # The previous recipient was derived from the openSUSE host key, which is
  # only readable from that running system. The rebuild goes straight to NixOS
  # without booting openSUSE, so those keys are unrecoverable — same situation
  # pelargir was in. Key pre-generated on the Mac at
  # ~/Development/secrets/minas-tirith/ and shipped via nixos-anywhere
  # --extra-files so sops decrypts on first boot.
  - &host_minas_tirith age1kge6r2ghkf8ereje35eq6x2h8pagkyqqj2pnl4ncz62af9uw95psq5p8y5

  # Host — pelargir (Pi 5 rebuild). Key PRE-GENERATED on the Mac 2026-08-03
  # (old host key died with the SD card; no copy survived). The private key is
  # staged at ~/Development/secrets/pelargir/ssh_host_ed25519_key and is placed
  # into /etc/ssh during install (INSTALL-RUNBOOK step 5), so sops-nix decrypts
  # from first boot.
  - &host_pelargir age1n9zjjqs4ny07n4x79k9d8jg2za4f5cfmmuh760juffm8pamk2q2spdax3l

  # Host — osgiliath. Derived from the stable SSH ed25519 host key that the
  # install runbook preserves before the NVMe is touched.
  - &host_osgiliath age1wfyz5x5xh7gj0ndk07746z905wzmuc20906udqq6c3lr6jg2npjs4fysnx

creation_rules:
  - path_regex: secrets/minas-tirith\.yaml$
    key_groups:
      - age:
          - *admin_edgar
          - *host_minas_tirith
  # Application secrets for workloads running IN the cluster. Recipients are the
  # admin and PELARGIR only — pelargir is the k3s server, so it is the host that
  # renders these into Secret manifests and applies them. minas is an agent with no
  # deploy credential and is deliberately NOT a recipient: adding it would hand a
  # worker node the ability to decrypt every application secret in the fleet.
  - path_regex: secrets/cluster-apps\.yaml$
    key_groups:
      - age:
          - *admin_edgar
          - *host_pelargir
  # PinCollector is isolated from the shared fleet application document so its
  # API, database, object-store, model and registry credentials can move and
  # rotate as one deployment unit. Pelargir renders the Kubernetes Secret;
  # minas receives only the namespaced Secret through the encrypted datastore.
  - path_regex: secrets/pin-collector\.yaml$
    key_groups:
      - age:
          - *admin_edgar
          - *host_pelargir
  # Authentik is separated from the shared application-secret file so its
  # encryption key, database credential, and one-time bootstrap hash can be
  # created/rotated as one identity-system unit. Pelargir renders and applies the
  # Kubernetes Secret; the workload node never receives a SOPS decryption identity.
  - path_regex: secrets/authentik\.yaml$
    key_groups:
      - age:
          - *admin_edgar
          - *host_pelargir
  - path_regex: secrets/pelargir\.yaml$
    key_groups:
      - age:
          - *admin_edgar
          - *host_pelargir
  - path_regex: secrets/osgiliath\.yaml$
    key_groups:
      - age:
          - *admin_edgar
          - *host_osgiliath
