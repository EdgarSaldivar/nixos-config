name: Nardol Steam tools image

on:
  workflow_dispatch:
  # Bootstrap the workflow before it exists on the default branch. Remove this
  # branch-only trigger in the digest-pinning commit after the first release.
  push:
    branches:
      - codex/nardol-luks-clevis
    paths:
      - .github/workflows/nardol-steam-tools.yml
      - hosts/nixos/nardol/steam-tools/**

permissions:
  contents: read

env:
  BASE_IMAGE: ghcr.io/games-on-whales/steam@sha256:ded0b1b47acd9adb8af9f068342f26ac31008904d9bbb91045d1a04e7d66a632
  LOCAL_IMAGE: nardol-steam-tools:test

concurrency:
  group: nardol-steam-tools-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the test image without registry credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: hosts/nixos/nardol/steam-tools
          file: hosts/nixos/nardol/steam-tools/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=nardol-steam-tools-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=nardol-steam-tools-${{ github.sha }}

      - name: Record and verify the tested runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' "${LOCAL_IMAGE}")"
          image_rootfs="$(docker image inspect --format '{{json .RootFS.Layers}}' "${LOCAL_IMAGE}")"
          image_size="$(docker image inspect --format '{{.Size}}' "${LOCAL_IMAGE}")"
          image_revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "${LOCAL_IMAGE}")"
          base_version="$(docker run --rm --network none --read-only \
            --entrypoint sh "${LOCAL_IMAGE}" \
            -c '. /etc/os-release; printf "%s" "$VERSION_ID"')"

          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${LOCAL_IMAGE}")" = '["/entrypoint.sh"]'
          test "$(docker image inspect --format '{{json .Config.User}}' "${LOCAL_IMAGE}")" = '"root"'
          test "$(docker image inspect --format '{{json .Config.WorkingDir}}' "${LOCAL_IMAGE}")" = '"/home/retro"'
          test "${image_revision}" = "${GITHUB_SHA}"
          test "${base_version}" = '25.04'

          jq -n \
            --arg image_id "${image_id}" \
            --argjson rootfs "${image_rootfs}" \
            --argjson size "${image_size}" \
            --arg revision "${image_revision}" \
            '{image_id: $image_id, rootfs: $rootfs, size: $size, revision: $revision}' \
            > image-contract.json

          echo "::warning title=Inherited EOL base::The pinned GoW image uses Ubuntu 25.04. The vulnerability delta gate below does not remove inherited base risk."

      - name: Re-run smoke tests as the Wolf app user
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --user 1000:1000 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,exec,mode=1777,size=16m \
            --entrypoint /usr/local/libexec/nardol-steam-tools-smoke-test \
            "${LOCAL_IMAGE}"

      - name: Install the pinned vulnerability scanner
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          cache-db: true

      - name: Reject new medium-or-higher vulnerabilities
        shell: bash
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set -Eeuo pipefail
          "${GRYPE}" --by-cve --output json "${BASE_IMAGE}" > base-grype.json
          "${GRYPE}" --by-cve --output json "${LOCAL_IMAGE}" > custom-grype.json

          vulnerability_filter='
            .matches[]
            | select(
                .vulnerability.severity == "Critical"
                or .vulnerability.severity == "High"
                or .vulnerability.severity == "Medium"
              )
            | [
                .artifact.type,
                .artifact.name,
                .artifact.version,
                .vulnerability.id,
                .vulnerability.severity
              ]
            | @tsv
          '
          jq -r "${vulnerability_filter}" base-grype.json \
            | sort -u > base-vulnerabilities.tsv
          jq -r "${vulnerability_filter}" custom-grype.json \
            | sort -u > custom-vulnerabilities.tsv
          comm -13 base-vulnerabilities.tsv custom-vulnerabilities.tsv \
            > new-vulnerabilities.tsv

          if [[ -s new-vulnerabilities.tsv ]]; then
            echo 'The toolbox introduced medium-or-higher vulnerability matches:' >&2
            sed 's/^/  /' new-vulnerabilities.tsv >&2
            exit 1
          fi

          inherited_count="$(wc -l < base-vulnerabilities.tsv | tr -d ' ')"
          {
            echo '### Vulnerability delta'
            echo
            echo "No medium-or-higher matches were added by the toolbox."
            echo "The pinned GoW base still contributes ${inherited_count} inherited matches."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate the tested image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: nardol-steam-tools.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload small verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nardol-steam-tools-${{ github.sha }}
          path: |
            image-contract.json
            nardol-steam-tools.spdx.json
            base-grype.json
            custom-grype.json
            base-vulnerabilities.tsv
            custom-vulnerabilities.tsv
            new-vulnerabilities.tsv
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nardol-steam-tools-${{ github.sha }}
          path: evidence

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Rehydrate the exact tested image from the run-scoped cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: hosts/nixos/nardol/steam-tools
          file: hosts/nixos/nardol/steam-tools/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=nardol-steam-tools-${{ github.sha }}

      - name: Refuse any build drift before authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_id="$(jq -er '.image_id' evidence/image-contract.json)"
          expected_rootfs="$(jq -c '.rootfs' evidence/image-contract.json)"
          expected_size="$(jq -er '.size' evidence/image-contract.json)"
          actual_id="$(docker image inspect --format '{{.Id}}' "${LOCAL_IMAGE}")"
          actual_rootfs="$(docker image inspect --format '{{json .RootFS.Layers}}' "${LOCAL_IMAGE}")"
          actual_size="$(docker image inspect --format '{{.Size}}' "${LOCAL_IMAGE}")"

          test "${actual_id}" = "${expected_id}"
          test "${actual_rootfs}" = "${expected_rootfs}"
          test "${actual_size}" = "${expected_size}"

      - name: Authenticate to GHCR after identity verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the verified full-commit tag
        id: push
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_name="ghcr.io/${owner}/nardol-steam-tools"
          image_tag="${image_name}:git-${GITHUB_SHA}"
          expected_id="$(jq -er '.image_id' evidence/image-contract.json)"

          auth_file="$(mktemp)"
          trap 'rm -f "${auth_file}"' EXIT
          printf 'machine ghcr.io login %s password %s\n' \
            "${GITHUB_ACTOR}" "${GHCR_TOKEN}" > "${auth_file}"
          registry_token="$(curl --fail --silent --show-error \
            --netrc-file "${auth_file}" \
            --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${owner}/nardol-steam-tools:pull" \
            https://ghcr.io/token | jq -er '.token // .access_token')"
          rm -f "${auth_file}"
          trap - EXIT

          manifest_status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --head \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${owner}/nardol-steam-tools/manifests/git-${GITHUB_SHA}")"
          case "${manifest_status}" in
            404) ;;
            200)
              echo "Refusing to replace existing immutable commit tag: ${image_tag}" >&2
              exit 1
              ;;
            *)
              echo "Refusing to publish after unexpected GHCR status ${manifest_status}" >&2
              exit 1
              ;;
          esac

          docker tag "${LOCAL_IMAGE}" "${image_tag}"
          push_output="$(docker push "${image_tag}" 2>&1)"
          printf '%s\n' "${push_output}"
          digest="$(sed -nE \
            's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' \
            <<< "${push_output}" | tail -n 1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          registry_config="$(docker buildx imagetools inspect \
            --raw "${image_name}@${digest}" | jq -er '.config.digest')"
          test "${registry_config}" = "${expected_id}"

          {
            echo "name=${image_name}"
            echo "tag=${image_tag}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attach signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attach the tested SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: evidence/nardol-steam-tools.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Report the immutable deployment reference
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.push.outputs.name }}
          IMAGE_TAG: ${{ steps.push.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '### Nardol Steam tools image'
            echo
            echo "Tested tag: ${IMAGE_TAG}"
            echo
            echo "Deploy only: ${IMAGE_NAME}@${IMAGE_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
